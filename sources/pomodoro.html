<title data-i18n="naslov">Pomodoro — krugovi rada i pauze</title>
<style>
/* ═══════════════════════════════════════════════════════════
   POMODORO

   Rad u krugovima: 25 minuta rada, kratka pauza, duga nakon
   četvrtog kruga. Jezgra ne zna kako se crta — prikaz se bira i
   mijenja se bez diranja odbrojavanja.
   ═══════════════════════════════════════════════════════════ */

:root {
  --sans: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
  --num: "DIN Alternate", "Helvetica Neue", Helvetica, Arial, sans-serif;

  --r: 14px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-7: 28px;
  --ctl: 44px;                       /* meta za prst, ne za miš */
  --install-offset: 92px;            /* traka za instalaciju ide iznad kontrola */
  --ease: cubic-bezier(.2, .8, .25, 1);
}

  /* Boja stanja nosi značenje — puni znamenku, boji prsten i pijesak u
     posudi — pa mora doseći 3:1 (WCAG 1.4.11) na podlozi na kojoj se
     crta. Sve su vrijednosti izmjerene, ne odabrane okom.

     Rad **nije** crven. Crvena je u ovom repozitoriju već zauzeta:
     `timer.html` je u svih pet tema koristi samo za kraj, a rad boji
     zeleno. Razlog je praktičan koliko i konvencionalan — ako je rad
     crven, zadnjim sekundama ne preostaje nijedna jača boja, pa se
     upozorenje nema čime razlikovati od stanja koje traje 25 minuta.

     Kraj se najavljuje u dva koraka, ne jednim skokom u crveno:
     `--blizu` (naranča) kad se približi, `--warn` (crvena) na samom
     kraju. Naranča je namjerno na 25° — petnaestak stupnjeva i od
     crvene i od jantara `--duga`, jer bi inače u dugoj pauzi prijelaz
     iz jantara u naranču prošao neprimijećen.

     Tonovi se razlikuju bojom, ne svjetlinom, pa naziv faze uvijek
     stoji uz boju kao tekst — boja nije jedini nositelj podatka. */

html[data-theme="dan"] {
  --blizu: #c25f16; --rad: #35618f; --kratka: #4e8c66; --duga: #ae8334; --warn: #c33a22;
  --bg: #faf8f3; --panel: #ffffff; --ink: #15140e;
  --dim: #6f6a5c; --faint: #9a9484;
  --line: #e3ded1; --line-2: #cdc5b2; --on-state: #fff;
  --spent: #cbc3ae;
}

html[data-theme="noc"] {
  --blizu: #f28b3a; --rad: #5b9bd5; --kratka: #57a37b; --duga: #d9a441; --warn: #ef5340;
  --bg: #131316; --panel: #1b1b1f; --ink: #ece9e2;
  --dim: #9a958a; --faint: #6b665c;
  --line: #2c2c31; --line-2: #3c3c44; --on-state: #10161c;
  --spent: #3e3e46;
}

html[data-theme="papir"] {
  --blizu: #ad5310; --rad: #2f5a85; --kratka: #43765a; --duga: #8f6a26; --warn: #b23a22;
  --bg: #f2ece0; --panel: #fbf7ef; --ink: #241f16;
  --dim: #6b6152; --faint: #9c9282;
  --line: #ddd4c2; --line-2: #c6bba5; --on-state: #fff;
  --spent: #c3b69c;
}

html[data-theme="ugljen"] {
  --blizu: #f5934a; --rad: #64a8e0; --kratka: #5fa87b; --duga: #e0b25c; --warn: #f2624c;
  --bg: #0e0e0f; --panel: #171719; --ink: #e6e6e8;
  --dim: #92929a; --faint: #63636b;
  --line: #26262a; --line-2: #36363c; --on-state: #0b1218;
  --spent: #37373f;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  overflow: hidden;                  /* ništa se nikad ne skrola */
  margin: 0;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

button { font: inherit; color: inherit; cursor: pointer; }

/* ═══ RASPORED ═════════════════════════════════════════════
   Tijelo je stupac: pozornica raste da popuni prostor, slojevi
   zadataka i tjedna sjede ispod nje kad su uključeni, kontrole su
   prikovane pri dnu. `min-height: 0` na pozornici je nužan — kao
   flex-dijete inače nasljeđuje `min-height: auto` i odbija biti
   manje od svog sadržaja, pa bi pozornica gurnula kontrole ispod
   ruba ekrana. To što je pozornica i sama grid-kontejner tu nije
   bitno — ograničenje dolazi od `main`-a kao flex-roditelja.
   ═══════════════════════════════════════════════════════════ */

main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}

/* Ćelija dobiva pravu veličinu, ne prilagođenu sadržaju: `stretch`
   umjesto `center` da prikaz (Task 6) ima raspon na koji se `100%`
   može osloniti, `overflow: hidden` da golema znamenka (Task 4) ne
   procuri preko slojeva ispod, `container-type: size` da se prikazi
   mjere po ovoj ćeliji, ne po dokumentu — isti obrazac kao `.pane`
   u `timer.html`. */
#stage {
  flex: 1;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
  display: grid;
  place-items: stretch;
  container-type: size;
}

#zadaci, #tjedan {
  flex-shrink: 0;
  border-top: 1px solid var(--line);
}

/* ═══ KONTROLE ═════════════════════════════════════════════
   Izvan `main`-a, ne unutra: raspon pozornice se time ne mijenja
   kad se doda ili makne sloj zadataka odnosno tjedna iznad. */

.kontrole {
  flex-shrink: 0;
  display: flex;
  gap: var(--sp-2);
  /* `main` uzima bočne umetke preko `padding`; ova traka je stvarno
     puna širina ekrana pa mora sama tražiti isto, inače krajnji
     gumbi upadnu pod zarez u pejzažu. */
  padding: var(--sp-3) calc(var(--sp-4) + env(safe-area-inset-right))
           calc(var(--sp-3) + env(safe-area-inset-bottom))
           calc(var(--sp-4) + env(safe-area-inset-left));
  border-top: 1px solid var(--line);
  background: var(--panel);
}

.kontrole button {
  flex: 1;
  height: var(--ctl);
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  background: none;
  color: var(--ink);
  font-size: .92rem;
  font-weight: 600;
}

/* Miješa se prema `--ink`, ne prema `--bg`: potonji je gotovo
   identičan `--panel` u danjoj temi (#faf8f3 na #fff), pa bi dodir
   ostao nevidljiv baš na zadanoj temi. */
.kontrole button:active { background: color-mix(in srgb, var(--panel) 88%, var(--ink)); }

/* Kreni je jedina puna, obojena kontrola — sve ostalo je opcija,
   ovo je radnja. Boja je boja rada, jer je mirno stanje uvijek
   priprema za sljedeći krug rada. */
/* Glavni gumb nosi boju **stanja**, ne fiksnu boju rada: dok traje
   pauza, plavi gumb bi tvrdio da radiš. `--go-boja` postavlja `paint`. */
#go {
  flex: 1.4;
  border-color: transparent;
  background: var(--go-boja, var(--rad));
  color: var(--on-state);
}

#go:active { background: color-mix(in srgb, var(--go-boja, var(--rad)) 84%, black); }

/* ═══ LADICA ═══════════════════════════════════════════════
   Sadržaj postavki dolazi kasnije; ovdje samo ljuska koja zna
   biti nevidljiva. `aria-hidden` je i semantika i prekidač prikaza
   — nema JS-a u ovom koraku koji bi dodavao posebnu klasu. */

.ladica {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: end center;
  padding: var(--sp-4);
  /* Zastor je namjerno neovisan o temi. Miješanje prema `--bg` gasi
     pozadinu prema njezinoj vlastitoj boji, pa na Uglju ploča
     (`--panel`) ostaje na 1,06:1 od zastora i drži je samo linija od
     1px. Crna na 42% zatamnjuje sve četiri teme jednako, a ploča se
     odvaja jer je svjetlija od onoga na čemu leži. */
  background: color-mix(in srgb, #000 42%, transparent);
  visibility: hidden;
  opacity: 0;
  transition: opacity .18s var(--ease), visibility .18s var(--ease);
}

.ladica[aria-hidden="false"] {
  visibility: visible;
  opacity: 1;
}

/* Kutija je odvojena od zastora da bi imala vlastitu granicu skrola —
   Task 12 u nju stavlja postavke i cijeli blok uputa, a `body` ima
   `overflow: hidden`, pa ovo ostaje jedino mjesto koje smije skrolati. */
.ladica-box {
  width: min(430px, 100%);
  box-shadow: 0 18px 48px rgb(0 0 0 / .32);
  max-height: calc(100dvh - var(--sp-6));
  overflow-y: auto;
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  background: var(--panel);
  padding-bottom: calc(var(--sp-4) + env(safe-area-inset-bottom));
}


/* ═══ PRIKAZI ══════════════════════════════════════════════
   Svaki prikaz je korijen koji popuni pozornicu i sam centrira
   svoj sadržaj. Mjere idu u `cq` jedinicama jer `#stage` nosi
   `container-type: size` — prikaz se tako mjeri po ćeliji, a ne
   po dokumentu, pa isti kod radi i na mobitelu i na projektoru.
   ═══════════════════════════════════════════════════════════ */

.prikaz {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-5);
  padding: var(--sp-5);
}

/* Naziv faze je jedini tekst koji mijenja boju sa stanjem. */
.faza {
  font-size: .7rem;
  font-weight: 600;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--faza-boja, var(--faint));
}

.brojka {
  font-family: var(--num);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.03em;
  line-height: 1;
}

/* Točke ciklusa: koliko je krugova rada iza tebe. */
.tocke { display: flex; gap: 7px; }
.tocke i {
  width: 8px; height: 8px; border-radius: 50%;
  border: 1.5px solid var(--line-2);
  background: none;
}
.tocke i.on { background: var(--faza-boja, var(--dim)); border-color: transparent; }

/* ── Znamenka ─────────────────────────────────────────────
   Boja se povlači iz znamenki odozdo. `background-clip: text`
   traži prozirnu boju teksta, pa se pozadina i mora postaviti
   svaki put — bez nje bi znamenka bila nevidljiva. */
.znamenka .brojka {
  font-size: min(30cqw, 42cqh);
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
}

/* ── Traka ────────────────────────────────────────────────
   Cijeli ciklus vodoravno; segmenti su razmjerni trajanju, pa
   se pauza vidi kao uski rez među blokovima rada. */
/* Mjera čitanja, i sredina: bez `margin-inline` traka s vlastitom
   širinom prestaje slijediti `stretch` iz `#stage` i zalijepi se uz
   lijevi rub. */
.traka {
  justify-content: center;
  gap: var(--sp-4);
  width: min(720px, 100%);
  margin-inline: auto;
}
.traka-vrh {
  width: 100%;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-3);
}
.traka .brojka { font-size: min(14cqw, 16cqh); }
.traka-strip {
  position: relative;
  width: 100%;
  height: min(11cqh, 54px);
  display: flex;
  gap: 2px;
}
.traka-seg { border-radius: 2px; transition: opacity .3s var(--ease); }
.traka-seg.done { opacity: .3; }
.traka-head {
  position: absolute;
  top: -7px; bottom: -7px;
  width: 2px;
  background: var(--ink);
  transition: left .25s linear;
}
.traka-head::after {
  content: "";
  position: absolute;
  top: -5px; left: -3px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--ink);
}
.traka-skala {
  width: 100%;
  display: flex;
  justify-content: space-between;
  font-size: .62rem;
  font-weight: 600;
  letter-spacing: .12em;
  color: var(--faint);
}

/* ── Prsten ───────────────────────────────────────────────
   Brojka sjedi u sredini preko `position: absolute`, jer bi je
   `gap` inače odgurnuo ispod prstena. */
.prsten-krug { position: relative; line-height: 0; }
.prsten-krug svg { display: block; width: min(62cqw, 62cqh); height: min(62cqw, 62cqh); }
.prsten-sred {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: var(--sp-2);
  line-height: 1;
}
.prsten .brojka { font-size: min(13cqw, 13cqh); }
.prsten-arc { transition: stroke-dashoffset .25s linear; }

/* ── Traka napretka (u znamenki, način `bar`) ───────────── */
.traka-napretka {
  width: min(320px, 70cqw);
  height: 4px;
  border-radius: 2px;
  background: var(--line);
  overflow: hidden;
}
.traka-napretka i { display: block; height: 100%; transition: width .25s linear; }

/* ── Kuhinjski sat ────────────────────────────────────────
   Predmet, ne dijagram: obruč i lice ne prate temu, jer replika koja
   se prebojava prestaje biti replika. Mijenja se samo ono oko njega. */
.kuhinjski { gap: var(--sp-4); }
.sat-tijelo { line-height: 0; filter: drop-shadow(0 10px 22px rgb(0 0 0 / .22)); }
.sat-tijelo svg { display: block; width: min(64cqw, 62cqh); height: min(64cqw, 62cqh); }
.kuhinjski .brojka { font-size: min(9cqw, 9cqh); }

/* ── Posuda ───────────────────────────────────────────────
   Gornji bulb se prazni u donji. Brojka je namjerno sitna —
   ovaj prikaz se gleda, ne očitava. */
.posuda svg { display: block; width: min(42cqw, 46cqh); height: min(60cqw, 66cqh); }
.posuda .brojka { font-size: min(7cqw, 8cqh); color: var(--dim); letter-spacing: .1em; }

/* ═══ ZAGLAVLJE ════════════════════════════════════════════ */

.vrh {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) calc(var(--sp-4) + env(safe-area-inset-right))
           var(--sp-3) calc(var(--sp-4) + env(safe-area-inset-left));
  padding-top: calc(var(--sp-3) + env(safe-area-inset-top));
}

.vrh-nacin {
  flex: 1;
  font-size: .68rem;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--faint);
}

.ikona {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: calc(var(--ctl) + 4px); height: calc(var(--ctl) + 4px);
  border: 0;
  border-radius: 50%;
  background: none;
  color: var(--dim);
}

.ikona:hover { background: color-mix(in srgb, var(--panel) 88%, var(--ink)); color: var(--ink); }
.ikona:active { background: color-mix(in srgb, var(--panel) 78%, var(--ink)); }

/* ═══ TRAJANJE (ručno) ═════════════════════════════════════ */

.trajanje {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  padding: 0 calc(var(--sp-4) + env(safe-area-inset-right))
           var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-left));
}

.presetovi { display: flex; gap: var(--sp-2); justify-content: center; }

.presetovi button {
  min-width: 66px;
  height: 30px;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  background: none;
  color: var(--dim);
  font-size: .78rem;
  font-weight: 600;
}

.presetovi button[aria-pressed="true"] {
  border-color: transparent;
  background: var(--rad);
  color: var(--on-state);
}

/* Klizač ne ide po sekundi nego po popisu okruglih vrijednosti, gušće
   na kratkom kraju gdje se i bira — inače je na mobitelu svaka pozicija
   pogađanje. Onemogućen je dok timer radi: mijenjati trajanje ispod
   odbrojavanja koje teče znači ili izgubiti napredak ili lagati o njemu. */
.klizac {
  width: 100%;
  height: var(--ctl);
  accent-color: var(--rad);
  background: none;
  cursor: pointer;
}

.klizac:disabled { opacity: .35; cursor: default; }

/* ═══ SADRŽAJ LADICE ═══════════════════════════════════════ */

.ladica-vrh {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-5);
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}

.ladica-vrh h2 { margin: 0; font-size: 1rem; font-weight: 600; }

.ladica-tijelo { padding: var(--sp-2) var(--sp-5) var(--sp-4); }

.polje { padding: var(--sp-4) 0; border-bottom: 1px solid var(--line); }
.polje:last-child { border-bottom: 0; }

/* Podpolje: pripada prekidaču iznad sebe, pa nema svoju crtu ni razmak
   koji bi ga od njega odvojio. */
.polje .polje {
  padding: var(--sp-1) 0 var(--sp-2) var(--sp-4);
  border-bottom: 0;
}
.polje .polje-ime { font-size: .62rem; color: var(--faint); margin-bottom: var(--sp-2); }

.polje-ime {
  margin: 0 0 var(--sp-3);
  font-size: .68rem;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--faint);
}

.cipovi { display: flex; flex-wrap: wrap; gap: var(--sp-2); }

.cipovi button {
  height: 34px;
  padding: 0 var(--sp-4);
  border: 1px solid var(--line-2);
  border-radius: 999px;
  background: none;
  color: var(--ink);
  font-size: .82rem;
  font-weight: 600;
}

/* Bez pokazivača ne znaš što ćeš pogoditi. Prijelaz je kratak da traka
   ne kasni za mišem, a `:hover` se gasi na dodirnim ekranima gdje bi
   inače ostao zaglavljen na zadnjem dirnutom gumbu. */
@media (hover: hover) {
  .cipovi button:hover { border-color: var(--dim); background: color-mix(in srgb, var(--panel) 92%, var(--ink)); }
  .cipovi button[aria-pressed="true"]:hover { background: color-mix(in srgb, var(--ink) 88%, var(--panel)); }
  .presetovi button:hover { border-color: var(--dim); }
  .broj-kontrola button:not(:disabled):hover { border-color: var(--dim); background: color-mix(in srgb, var(--panel) 92%, var(--ink)); }
  .sklopka:hover { border-color: var(--dim); }
  .sklopka[aria-checked="true"]:hover { background: color-mix(in srgb, var(--ink) 86%, var(--panel)); }
  .polje:hover .polje-ime { color: var(--dim); }

<script id="jezgra">
/* ═══════════════════════════════════════════════════════════
   JEZGRA

   Ne dira DOM i ne čita sat sama od sebe — vrijeme joj se
   predaje. Zato se dade izvršiti i izvan preglednika.
   ═══════════════════════════════════════════════════════════ */
const JEZGRA = (() => {

  const DEFAULTS = {
    /* Način mijenja i slijed i to tko ga gura dalje:

         auto   — slijed je zadan, ali svaki korak čeka tvoj klik
         full   — slijed je zadan i teče sam
         rucno  — nema slijeda; jedan timer, trajanje zadaješ ti      */
    nacin: 'auto',

    rad: 25, kratka: 5, duga: 15, ciklus: 4,
    rucnoSek: 1500,

    /* Prikaz se pamti po obitelji načina, ne globalno: traka crta plan
       ciklusa, pa je u ručnom nema — a bilo bi neugodno da prebacivanje
       na ručno tiho promijeni prikaz i u auto načinu. */
    prikazi: { ciklus: 'traka', rucno: 'prsten' },

    zadaciOn: true, tjedanOn: true,
    zvuk: true, odbroj: true, odbrojSek: 5, najava: true, najavaMin: 1,
    napredak: 'deflate', brzina: 1,
    obavijesti: false, budan: true,
    tema: 'dan', lang: null
  };

  const jeCiklus = (cfg) => cfg.nacin !== 'rucno';

  /** Plan jednog ciklusa: rad, kratka, … rad, duga. */
  function plan(cfg) {
    const faze = [];
    for (let i = 0; i < cfg.ciklus; i++) {
      faze.push({ faza: 'rad', min: cfg.rad });
      faze.push(i === cfg.ciklus - 1
        ? { faza: 'duga', min: cfg.duga }
        : { faza: 'kratka', min: cfg.kratka });
    }
    return faze;
  }

  const trajanje = (cfg, faza) => faza === 'rucno'
    ? Math.max(1, cfg.rucnoSek) * 1000
    : ({ rad: cfg.rad, kratka: cfg.kratka, duga: cfg.duga }[faza] || 0) * 60000;

  /**
   * Lokalni datum, ne `toISOString()`.
   *
   * `toISOString` je UTC, pa bi se dnevni brojač u našoj zoni
   * resetirao u dva ujutro.
   */
  function danas(d = new Date()) {
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  /** Koja faza dolazi iza dane, i s kojim brojem kruga. */
  function sljedeca(cfg, faza, krug) {
    if (faza === 'rad') {
      return krug >= cfg.ciklus - 1 ? { faza: 'duga', krug } : { faza: 'kratka', krug };
    }
    if (faza === 'kratka') return { faza: 'rad', krug: krug + 1 };
    return { faza: 'rad', krug: 0 };
  }

  /** Položaj unutar cijelog plana — treba samo prikazu „traka". */
  function udioSeanse(cfg, krug, faza, udio) {
    const faze = plan(cfg);
    const ukupno = faze.reduce((zbroj, x) => zbroj + x.min, 0);
    const index = faza === 'rad' || faza === null ? krug * 2 : krug * 2 + 1;
    let prije = 0;
    for (let i = 0; i < index; i++) prije += faze[i].min;
    return (prije + faze[index].min * (faza === null ? 0 : udio)) / ukupno;
  }

  /**
   * Stanje ima četiri oblika, ne dva:
   *
   *   mirno        — ništa nije odabrano, `Kreni` pokreće od početka
   *   pripremljeno — faza je poznata, ali čeka klik (to je auto način)
   *   u tijeku     — teče
   *   pauzirano    — stoji, `ostatak` pamti koliko je bilo
   */
  function stanje(cfg, run, sada) {
    const ciklus = jeCiklus(cfg);
    const seansa = (faza, udio) => ciklus ? udioSeanse(cfg, run.krug, faza, udio) : 0;

    if (!run.faza) {
      return { mirno: true, pripremljeno: false, pauzirano: false, faza: null, ciklus,
               preostalo: trajanje(cfg, ciklus ? 'rad' : 'rucno'), udio: 0, zavrsava: false, blizu: false,
               krug: run.krug, udioSeanse: seansa(null, 0) };
    }

    const puno = trajanje(cfg, run.faza);

    if (run.endsAt == null && run.ostatak == null) {
      return { mirno: false, pripremljeno: true, pauzirano: false, faza: run.faza, ciklus,
               preostalo: puno, udio: 0, zavrsava: false, blizu: false, krug: run.krug,
               udioSeanse: seansa(run.faza, 0) };
    }

    const preostalo = Math.max(0, run.ostatak != null ? run.ostatak : run.endsAt - sada);
    const udio = puno ? 1 - preostalo / puno : 1;
    /* Kraj se najavljuje u dva koraka. Pragovi su isti brojevi kojima
       se ravna i zvuk — najava i odbrojavanje — pa oko i uho govore o
       istom trenutku. Prekidači zvuka na boju ne utječu: to su dva
       kanala, a gašenje zvuka ne znači da ne želiš vidjeti da se bliži
       kraj.

       Gornja granica veže prag uz trajanje faze: bez nje bi tridesetak
       sekundi najave na ručnom timeru od 30 sekundi obojilo cijeli krug
       u naranču, a on tada ne bi značio ništa. */
    const tece = run.ostatak == null && preostalo > 0;
    const pragCrvene = Math.min(Number(cfg.odbrojSek) * 1000, puno * 0.15);
    const pragNaranče = Math.min(Number(cfg.najavaMin) * 60000, puno * 0.5);
    const zavrsava = tece && preostalo <= pragCrvene;
    const blizu = tece && !zavrsava && preostalo <= pragNaranče;
    return { mirno: false, pripremljeno: false, pauzirano: run.ostatak != null,
             faza: run.faza, ciklus, preostalo, udio, zavrsava, blizu, krug: run.krug,
             udioSeanse: seansa(run.faza, udio) };
  }

  return { DEFAULTS, jeCiklus, plan, trajanje, danas, sljedeca, udioSeanse, stanje };
})();
</script>

/* ═══════════════════════════════════════════════════════════
   1 · Postavke — sve preživi zatvaranje kartice
   ═══════════════════════════════════════════════════════════ */

const STORE = 'workshop.pomodoro';

let cfg = { ...JEZGRA.DEFAULTS };

try {

  const granica = new Date();

  const najstariji = JEZGRA.danas(granica);
  for (const dan of Object.keys(dani)) if (dan < najstariji) delete dani[dan];
}

const save = () => {
  orezi();

  catch { /* privatni način */ }

   ═══════════════════════════════════════════════════════════ */

const ODBROJ = [3, 5, 10, 30];

const NAJAVA = [1, 5, 10];

let bazaVirt = Date.now();

const sada = () => bazaVirt + (Date.now() - bazaStvarna) * brzina();

if (cfg.brzina !== 1) run = { faza: null, krug: 0, endsAt: null, ostatak: null, zadatak: run.zadatak };

/* ═══════════════════════════════════════════════════════════

  for (const oznaka of navigator.languages || [navigator.language || 'hr']) {

  { id: 'ugljen', kljuc: 'temaUgljen', nacini: SVI_NACINI, cipovi: ['#0e0e0f', '#171719', '#64a8e0'] }
];

const temeZa = (nacin) => TEME.filter((x) => x.nacini.includes(nacin));

const temaVrijedi = (id, nacin) => temeZa(nacin).some((x) => x.id === id);

function applyTheme(id) {
  // Nekompatibilna tema ne ostaje na snazi: uzima se prva koja vrijedi.
  const dopustene = temeZa(cfg.nacin);
  cfg.tema = temaVrijedi(id, cfg.nacin) ? id : (dopustene[0]?.id || 'dan');
  document.documentElement.dataset.theme = cfg.tema;
  syncThemeColor();
  save();
  paint();
  osvjeziPostavke();
}

/** Traka preglednika prati temu — čita se stvarni `--bg` nakon promjene. */
function syncThemeColor() {
  const boja = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', boja);
}

/* ═══════════════════════════════════════════════════════════
   4 · Prikazi

   Ugovor su dvije metode: `mount` upiše markup jednom i zapamti
   čvorove, `paint` mijenja samo vrijednosti. `paint` se zove svake
   sekunde, pa ondje ne smije biti gradnje DOM-a.
   ═══════════════════════════════════════════════════════════ */

const PRIKAZI = {};

/* Traka crta plan ciklusa, pa je u ručnom načinu nema što crtati —
   ondje bi bila prazan pravokutnik koji tvrdi da postoji slijed. */
const PRIKAZI_ZA = {
  ciklus: ['traka', 'znamenka', 'prsten', 'posuda', 'kuhinjski'],
  rucno: ['znamenka', 'prsten', 'posuda', 'kuhinjski']
};

const obitelj = () => JEZGRA.jeCiklus(cfg) ? 'ciklus' : 'rucno';
const dopusteni = () => PRIKAZI_ZA[obitelj()];
const prikazId = () => dopusteni().includes(cfg.prikazi[obitelj()])
  ? cfg.prikazi[obitelj()]
  : dopusteni()[0];

const stage = document.getElementById('stage');
const prikaz = () => PRIKAZI[prikazId()];

/* Koji je prikaz stvarno u DOM-u. Prikazi čuvaju svoje čvorove na sebi,
   pa crtanje po onome kojem `mount` nije prošao ruši petlju — a `prikazId()`
   se mijenja čim se promijeni način, prije nego se išta montira. */
let montiran = null;
let zadnjaSekunda = -1;

/* Boja slijedi **stanje**, ne samo fazu: zadnje sekunde nose vlastitu,
   jer je upozorenje drugi podatak od toga koja faza traje. */
const bojaStanja = (s) => {
  if (!s.faza) return 'var(--faint)';
  if (s.zavrsava) return 'var(--warn)';
  if (s.blizu) return 'var(--blizu)';
  return `var(--${s.faza === 'rucno' ? 'rad' : s.faza})`;
};

/* Boja kojom se puni potrošeni dio znamenke. Prati iste stupnjeve, pa
   se popunjava onim što u tom trenutku znači „bliži se kraj" — a ne
   crvenom od prve sekunde.

   Neutralni ton je `--spent`, ne `--line`: linija je namjerno jedva
   vidljiva (1,27:1 prema podlozi), pa bi pri kraju kruga, kad je
   potrošeno gotovo sve, znamenka nestala sa zaslona. */
const bojaPotrosenog = (s) => s.zavrsava ? 'var(--warn)' : s.blizu ? 'var(--blizu)' : 'var(--spent)';

const NAPREDAK = ['bar', 'deflate', 'fill'];
const nacinNapretka = () => NAPREDAK.includes(cfg.napredak) ? cfg.napredak : 'deflate';

const sat = (ms) => {
  const uk = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(uk / 3600);
  const m = Math.floor(uk % 3600 / 60);
  const sek = uk % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h ? `${h}:${pad(m)}:${pad(sek)}` : `${pad(m)}:${pad(sek)}`;
};

function postaviPrikaz(id) {
  if (dopusteni().includes(id)) cfg.prikazi[obitelj()] = id;
  const zeljeni = prikazId();
  stage.replaceChildren();          // bez ovoga ostaju mrtvi čvorovi
  PRIKAZI[zeljeni].mount(stage);
  montiran = zeljeni;
  zadnjaSekunda = -1;               // novi prikaz mora dobiti prvo crtanje
  paint();
  save();
  osvjeziPostavke();
}

const tocke = (n) => {
  const el = document.createElement('div');
  el.className = 'tocke';
  el.replaceChildren(...Array.from({ length: n }, () => document.createElement('i')));
  return el;
};

/** Točke broje krugove ciklusa; u ručnom načinu ciklusa nema. */
function paliTocke(el, s) {
  el.hidden = !s.ciklus;
  [...el.children].forEach((tocka, i) => tocka.classList.toggle('on', i < s.krug));
}

/* ── Traka ─────────────────────────────────────────────── */
PRIKAZI.traka = {
  mount(el) {
    const korijen = document.createElement('div');
    korijen.className = 'prikaz traka';
    korijen.innerHTML = `
      <div class="traka-vrh">
        <span class="brojka" data-time>00:00</span>
        <span class="faza" data-faza></span>
      </div>
      <div class="traka-strip" data-strip><div class="traka-head" data-head></div></div>
      <div class="traka-skala" data-skala></div>`;
    el.append(korijen);

    this.time = korijen.querySelector('[data-time]');
    this.fazaEl = korijen.querySelector('[data-faza]');
    this.head = korijen.querySelector('[data-head]');
    const strip = korijen.querySelector('[data-strip]');

    // Segmenti su razmjerni trajanju, pa se pauza vidi kao uski rez.
    this.segmenti = JEZGRA.plan(cfg).map((korak) => {
      const seg = document.createElement('div');
      seg.style.flex = korak.min;
      seg.className = 'traka-seg';
      seg.style.background = korak.faza === 'rad' ? 'var(--ink)' : `var(--${korak.faza})`;
      strip.insertBefore(seg, this.head);
      return seg;
    });

    const uk = JEZGRA.plan(cfg).reduce((zbroj, x) => zbroj + x.min, 0);
    korijen.querySelector('[data-skala]').innerHTML =
      `<span>0</span><span>${Math.round(uk / 2)} ${t('min')}</span><span>${uk} ${t('min')}</span>`;
  },
  paint(s) {
    this.time.textContent = sat(s.preostalo);
    this.fazaEl.textContent = t(s.faza || 'mirno');
    this.head.style.left = `${s.udioSeanse * 100}%`;
    const tekuci = s.faza === 'kratka' || s.faza === 'duga' ? s.krug * 2 + 1 : s.krug * 2;
    this.segmenti.forEach((seg, i) => seg.classList.toggle('done', i < tekuci));
  }
};

/* ── Znamenka ──────────────────────────────────────────── */
PRIKAZI.znamenka = {
  mount(el) {
    const korijen = document.createElement('div');
    korijen.className = 'prikaz znamenka';
    korijen.innerHTML = `
      <span class="faza" data-faza></span>
      <span class="brojka" data-time>00:00</span>
      <span class="traka-napretka" data-bar hidden><i data-bar-fill></i></span>`;
    korijen.append(tocke(cfg.ciklus));
    el.append(korijen);
    this.time = korijen.querySelector('[data-time]');
    this.fazaEl = korijen.querySelector('[data-faza]');
    this.bar = korijen.querySelector('[data-bar]');
    this.barFill = korijen.querySelector('[data-bar-fill]');
    this.krugovi = korijen.querySelector('.tocke');
  },
  paint(s) {
    this.time.textContent = sat(s.preostalo);
    this.fazaEl.textContent = t(s.faza || 'mirno');

    const boja = bojaStanja(s);
    const razina = Math.round((1 - s.udio) * 100);
    const nacin = nacinNapretka();

    this.bar.hidden = nacin !== 'bar';
    if (nacin === 'bar') {
      // Znamenka ostaje puna; napredak nosi zasebna traka ispod nje.
      this.time.style.backgroundImage = 'none';
      this.time.style.webkitTextFillColor = boja;
      this.barFill.style.width = `${razina}%`;
      this.barFill.style.background = boja;
      return;
    }

    this.time.style.webkitTextFillColor = '';
    // `deflate` prazni znamenku u neutralno, `fill` je puni odozgo —
    // potrošeno se vidi, a ne samo preostalo.
    const potroseno = nacin === 'fill' ? bojaPotrosenog(s) : 'var(--spent)';
    this.time.style.backgroundImage =
      `linear-gradient(0deg, ${boja} ${razina}%, ${potroseno} ${razina}%)`;
    paliTocke(this.krugovi, s);
  }
};

/* ── Prsten ────────────────────────────────────────────── */
const OPSEG = 2 * Math.PI * 74;

PRIKAZI.prsten = {
  mount(el) {
    const korijen = document.createElement('div');
    korijen.className = 'prikaz prsten';
    korijen.innerHTML = `
      <div class="prsten-krug">
        <svg viewBox="0 0 168 168">
          <circle cx="84" cy="84" r="74" fill="none" stroke="var(--line)" stroke-width="9"/>
          <circle class="prsten-arc" data-arc cx="84" cy="84" r="74" fill="none" stroke-width="9"
                  transform="rotate(-90 84 84)"
                  stroke-dasharray="${OPSEG}" stroke-dashoffset="${OPSEG}"/>
        </svg>
        <div class="prsten-sred">
          <span class="brojka" data-time>00:00</span>
          <span class="faza" data-faza></span>
        </div>
      </div>`;
    korijen.append(tocke(cfg.ciklus));
    el.append(korijen);
    this.arc = korijen.querySelector('[data-arc]');
    this.time = korijen.querySelector('[data-time]');
    this.fazaEl = korijen.querySelector('[data-faza]');
    this.krugovi = korijen.querySelector('.tocke');
  },
  paint(s) {
    this.time.textContent = sat(s.preostalo);
    this.fazaEl.textContent = t(s.faza || 'mirno');
    this.arc.setAttribute('stroke', bojaStanja(s));
    this.arc.setAttribute('stroke-dashoffset', OPSEG * (1 - s.udio));
    paliTocke(this.krugovi, s);
  }
};

/* ── Kuhinjski sat ─────────────────────────────────────────
   Replika mehaničkog kuhinjskog timera: metalni obruč, bijelo lice,
   brojke 0–55 zakrenute radijalno i crveni isječak koji se steže.

   Na ovom licu crvena **ne znači opasnost nego preostalo** — tako je
   na samom predmetu. Zato isječak ostaje crven u svim fazama, a koja
   je faza piše ispod, u boji faze.

   Skala je apsolutnih 60 minuta, kao na predmetu. Trajanje duže od
   sata puni krug do kraja i počinje se micati kad padne ispod 60. */

const SAT_CRVENA = '#e8340c';

/** Isječak od 12 sati u smjeru kazaljke, u stupnjevima. */
function isjecak(cx, cy, r, kut) {
  if (kut <= 0) return '';
  if (kut >= 359.99) return `M${cx} ${cy - r}A${r} ${r} 0 1 1 ${cx - 0.01} ${cy - r}Z`;
  const rad = (kut - 90) * Math.PI / 180;
  return `M${cx} ${cy}L${cx} ${cy - r}A${r} ${r} 0 ${kut > 180 ? 1 : 0} 1 `
       + `${(cx + r * Math.cos(rad)).toFixed(2)} ${(cy + r * Math.sin(rad)).toFixed(2)}Z`;
}

PRIKAZI.kuhinjski = {
  mount(el) {
    const korijen = document.createElement('div');
    korijen.className = 'prikaz kuhinjski';

    const crte = [];
    for (let m = 0; m < 60; m++) {
      const veliki = m % 5 === 0;
      crte.push(`<line x1="100" y1="${veliki ? 42 : 51}" x2="100" y2="59"`
        + ` stroke="#15140e" stroke-width="${veliki ? 2.6 : 1.1}"`
        + ` transform="rotate(${m * 6} 100 100)"/>`);
    }

    const brojke = [];
    for (let m = 0; m < 60; m += 5) {
      brojke.push(`<text x="100" y="35" transform="rotate(${m * 6} 100 100)"`
        + ` text-anchor="middle" fill="#15140e" font-family="var(--num)"`
        + ` font-size="15" font-weight="700">${m}</text>`);
    }

    korijen.innerHTML = `
      <div class="sat-tijelo">
        <svg viewBox="0 0 200 200">
          <defs>
            <linearGradient id="obruc" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#e9e9ea"/><stop offset=".35" stop-color="#9a9a9e"/>
              <stop offset=".62" stop-color="#d8d8da"/><stop offset="1" stop-color="#7e7e83"/>
            </linearGradient>
            <linearGradient id="gumb" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#d5d5d8"/><stop offset=".48" stop-color="#8e8e93"/>
              <stop offset=".52" stop-color="#b8b8bd"/><stop offset="1" stop-color="#7a7a80"/>
            </linearGradient>
          </defs>
          <circle cx="100" cy="100" r="98" fill="url(#obruc)"/>
          <circle cx="100" cy="100" r="86" fill="#141414"/>
          <circle cx="100" cy="100" r="81" fill="#fbfbfa"/>
          <path data-isjecak fill="${SAT_CRVENA}"/>
          ${crte.join('')}
          ${brojke.join('')}
          <circle cx="100" cy="100" r="15" fill="url(#gumb)"/>
          <circle cx="100" cy="100" r="15" fill="none" stroke="#6f6f74" stroke-width=".8"/>
        </svg>
      </div>
      <span class="brojka" data-time>00:00</span>
      <span class="faza" data-faza></span>`;

    el.append(korijen);
    this.isjecak = korijen.querySelector('[data-isjecak]');
    this.time = korijen.querySelector('[data-time]');
    this.fazaEl = korijen.querySelector('[data-faza]');
  },
  paint(s) {
    const minuta = Math.min(60, s.preostalo / 60000);
    this.isjecak.setAttribute('d', isjecak(100, 100, 59, minuta * 6));
    this.time.textContent = sat(s.preostalo);
    this.fazaEl.textContent = t(s.faza || 'mirno');
  }
};

/* ── Posuda ────────────────────────────────────────────── */
PRIKAZI.posuda = {
  mount(el) {
    const korijen = document.createElement('div');
    korijen.className = 'prikaz posuda';
    // Bulbovi su trokuti koji se sastaju u struku; pijesak je
    // pravokutnik ošišan njihovim oblikom.
    korijen.innerHTML = `
      <svg viewBox="0 0 128 184">
        <defs>
          <clipPath id="pGore"><path d="M18 18h92L64 92Z"/></clipPath>
          <clipPath id="pDolje"><path d="M64 92 110 166H18Z"/></clipPath>
        </defs>
        <path d="M18 18h92L64 92Z" fill="var(--line)"/>
        <path d="M64 92 110 166H18Z" fill="var(--line)"/>
        <g clip-path="url(#pGore)"><rect data-gore x="0" width="128"/></g>
        <g clip-path="url(#pDolje)"><rect data-dolje x="0" width="128" opacity=".55"/></g>
        <path data-mlaz d="M64 84v24" stroke-width="2.6" stroke-linecap="round" opacity="0"/>
        <path d="M14 10h100M14 174h100" stroke="var(--ink)" stroke-width="3.4" stroke-linecap="round"/>
      </svg>
      <span class="brojka" data-time>00:00</span>
      <span class="faza" data-faza></span>`;
    el.append(korijen);
    this.gore = korijen.querySelector('[data-gore]');
    this.dolje = korijen.querySelector('[data-dolje]');
    this.mlaz = korijen.querySelector('[data-mlaz]');
    this.time = korijen.querySelector('[data-time]');
    this.fazaEl = korijen.querySelector('[data-faza]');
  },
  paint(s) {
    const boja = bojaStanja(s);
    this.gore.setAttribute('y', 18 + s.udio * 74);
    this.gore.setAttribute('height', 74 - s.udio * 74);
    this.gore.setAttribute('fill', boja);
    this.dolje.setAttribute('y', 166 - s.udio * 74);
    this.dolje.setAttribute('height', s.udio * 74);
    this.dolje.setAttribute('fill', boja);
    // Mlaz postoji samo dok pijesak stvarno pada — u mirovanju i na
    // pauzi bi tvrdio da nešto teče, a ne teče.
    const tece = !s.mirno && !s.pripremljeno && !s.pauzirano && s.udio > 0 && s.udio < 1;
    this.mlaz.setAttribute('stroke', boja);
    this.mlaz.setAttribute('opacity', tece ? '1' : '0');
    this.time.textContent = sat(s.preostalo);
    this.fazaEl.textContent = t(s.faza || 'mirno');
  }
};

/* ═══════════════════════════════════════════════════════════
   4b · Zvuk

   Tonovi se sintetiziraju — nema datoteke koja se učitava, pa alat
   ostaje jedna samostalna datoteka i radi bez mreže. iOS pušta zvuk
   tek nakon dodira, zato se kontekst otvara na prvi pritisak.
   ═══════════════════════════════════════════════════════════ */

let audio = null;
let zakazani = [];

function wakeAudio() {
  if (!audio) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audio = new Ctx();
  }
  if (audio.state === 'suspended') audio.resume();
  return audio;
}

/** Jedan ton. `delay` je odmak u sekundama **stvarnog** vremena. */
function ton(freq, sekundi, glasnoca = 0.22, delay = 0, oblik = 'sine') {
  const ctx = wakeAudio();
  if (!ctx) return [];
  const at = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = oblik;
  osc.frequency.setValueAtTime(freq, at);
  // Nagli početak i mekan kraj — inače se čuje škljocaj na rubovima.
  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.exponentialRampToValueAtTime(glasnoca, at + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + sekundi);
  osc.connect(gain).connect(ctx.destination);
  osc.start(at);
  osc.stop(at + sekundi + 0.03);
  return [osc];
}

/**
 * Tri signala, i nijedan ne smije zvučati kao drugi.
 *
 *   najava   — nizak, mek, kratak. „Bliži se kraj."
 *   odbroj   — visok, vrlo kratak, tih. Jedan po sekundi.
 *   kraj     — jedan ton, dug i pun. „Gotovo je."
 *
 * Razlikuju se u sve tri dimenzije odjednom — visini, trajanju i
 * glasnoći — jer se sluša usput, a ne pozorno. Dva signala koja dijele
 * dvije od tri postaju isti zvuk čim nisi usredotočen na njih.
 */
const SIGNAL = {
  najava: { freq: 392,    trajanje: 0.4,  glasnoca: 0.14, oblik: 'triangle' },
  odbroj: { freq: 1046.5, trajanje: 0.07, glasnoca: 0.16, oblik: 'sine' },
  kraj:   { freq: 659.25, trajanje: 0.7,  glasnoca: 0.32, oblik: 'sine' }
};

const signal = (ime, delay) => {
  const z = SIGNAL[ime];
  return ton(z.freq, z.trajanje, z.glasnoca, delay, z.oblik);
};

function otkaziZvuk() {
  for (const osc of zakazani) { try { osc.stop(); } catch { /* već gotov */ } }
  zakazani = [];
}

/**
 * Zvuk se zakazuje unaprijed, na satu zvučnog sklopa.
 *
 * Da se oglašava po okviru, u pozadinskoj kartici ne bi bilo ničega —
 * ondje preglednik zaustavlja `requestAnimationFrame`. Ovako signali
 * odu u red čim faza krene i čuju se bez obzira gdje je kartica.
 *
 * Odmaci se dijele brzinom sata: zvučni sklop mjeri stvarne sekunde,
 * a `preostalo` je u virtualnima.
 */
function zakaziZvuk() {
  otkaziZvuk();
  if (!cfg.zvuk || !run.faza || run.ostatak != null || run.endsAt == null) return;
  if (!wakeAudio()) return;

  // Zvučni sklop mjeri stvarne sekunde, a `preostalo` je u virtualnima.
  const doKraja = (run.endsAt - sada()) / 1000 / brzina();
  if (doKraja <= 0) return;
  const punoSek = JEZGRA.trajanje(cfg, run.faza) / 1000 / brzina();

  // Najava se preskače kad je faza jedva duža od nje same — javka koja
  // stigne u prvoj sekundi kruga ne najavljuje ništa.
  if (cfg.najava) {
    const prije = Number(cfg.najavaMin) * 60 / brzina();
    const kada = doKraja - prije;
    if (kada > 0 && punoSek > prije * 1.5) zakazani.push(...signal('najava', kada));
  }

  if (cfg.odbroj) {
    const odSek = Math.min(Number(cfg.odbrojSek) || 5, Math.floor(doKraja * brzina()));
    for (let n = odSek; n >= 1; n--) {
      const kada = doKraja - n / brzina();
      if (kada > 0) zakazani.push(...signal('odbroj', kada));
    }
  }

  zakazani.push(...signal('kraj', doKraja));
}

/**
 * Ispusti zakazano iz popisa, ali ga ne zaustavljaj.
 *
 * Signal kraja svira i nakon nule. U full auto načinu sljedeća faza
 * odmah zove `zakaziZvuk`, koji počinje s `otkaziZvuk` — pa bi pokosio
 * upravo ono što se u tom trenutku čuje.
 */
const pustiZvuk = () => { zakazani = []; };

/* ═══════════════════════════════════════════════════════════
   4c · Ekran ostaje upaljen dok faza traje
   ═══════════════════════════════════════════════════════════ */

let lock = null;

async function drziBudan() {
  if (!cfg.budan || !run.faza || run.ostatak == null && run.endsAt == null) return pustiBudan();
  if (run.ostatak != null) return pustiBudan();          // pauza ne treba ekran
  if (lock) return;
  try { lock = await navigator.wakeLock?.request('screen'); }
  catch { lock = null; }                                  // odbijeno ili nema podrške
  lock?.addEventListener?.('release', () => { lock = null; });
}

function pustiBudan() {
  try { lock?.release?.(); } catch { /* već otpuštena */ }
  lock = null;
}

/* Sustav otpušta bravu kad se kartica sakrije; pri povratku je treba natrag. */
addEventListener('visibilitychange', () => { if (!document.hidden) drziBudan(); });

/* ═══════════════════════════════════════════════════════════
   5 · Odbrojavanje

   Vrijeme se čita iz sata, ne zbraja po okviru — inače alat
   zaostane čim preglednik uspori karticu u pozadini.
   ═══════════════════════════════════════════════════════════ */

const els = {
  go: document.getElementById('go'),
  skip: document.getElementById('skip'),
  reset: document.getElementById('reset'),
  trajanje: document.getElementById('trajanje'),
  klizac: document.getElementById('klizac'),
  ladica: document.getElementById('ladica')
};

let backstop = null;

/** Rezerva za slučaj da petlja ne dođe do izraza (kartica u pozadini). */
function naoruzaj() {
  clearTimeout(backstop);
  if (!run.faza || run.ostatak != null || run.endsAt == null) return;
  // Odgoda je u stvarnom vremenu, pa se virtualni ostatak dijeli brzinom.
  backstop = setTimeout(zavrsiFazu, Math.max(0, run.endsAt - sada()) / brzina() + 40);
}

/** Faza kojom se kreće iz mirnog stanja — ovisi o načinu. */
const prvaFaza = () => JEZGRA.jeCiklus(cfg) ? 'rad' : 'rucno';

function kreni(faza = run.faza || prvaFaza()) {
  wakeAudio();
  run.faza = faza;
  run.endsAt = sada() + (run.ostatak != null ? run.ostatak : JEZGRA.trajanje(cfg, faza));
  run.ostatak = null;
  naoruzaj();
  zakaziZvuk();
  syncLive();
  drziBudan();
  save();
  paint();
}

function pauziraj() {
  if (!run.faza || run.endsAt == null || run.ostatak != null) return;
  run.ostatak = Math.max(0, run.endsAt - sada());
  run.endsAt = null;
  clearTimeout(backstop);
  otkaziZvuk();
  syncLive();
  pustiBudan();
  save();
  paint();
}

/** Preskakanje ne broji krug — nisi ga odradio. */
function preskoci() {
  if (!JEZGRA.jeCiklus(cfg)) return;
  const dalje = JEZGRA.sljedeca(cfg, run.faza || 'rad', run.krug);
  otkaziZvuk();
  clearTimeout(backstop);
  run.krug = dalje.krug;
  run.ostatak = null;
  run.endsAt = null;
  run.faza = dalje.faza;
  // Preskakanje u full auto načinu odmah kreće dalje; u auto načinu
  // ostaje pripremljeno, jer je i ondje svaki korak tvoja odluka.
  if (cfg.nacin === 'full') kreni(dalje.faza); else { save(); paint(); }
}

function reset() {
  otkaziZvuk();
  clearTimeout(backstop);
  run = { faza: null, krug: 0, endsAt: null, ostatak: null, zadatak: run.zadatak };
  pustiBudan();
  syncLive();
  save();
  paint();
}

/**
 * Kraj faze.
 *
 * Poziva se s tri strane: iz petlje, iz `backstop` timeouta i pri
 * povratku na karticu. Sva tri mogu okinuti u istoj sekundi, pa se
 * `endsAt` odmah na ulazu poništi — drugi poziv zatekne `null` i
 * tiho izađe. Bez toga jedan kraj faze zabilježi dva kruga.
 */
function zavrsiFazu() {
  const bio = run.faza;
  if (!bio || run.endsAt == null || run.ostatak != null) return;
  run.endsAt = null;
  clearTimeout(backstop);

  // U dnevni brojač ulaze samo krugovi rada iz ciklusa. Ručni timer
  // nije krug — mjeri vrijeme, ne pomodore.
  if (bio === 'rad') {
    const dan = JEZGRA.danas();
    dani[dan] = (dani[dan] || 0) + 1;
    const zadatak = zadaci.find((z) => z.id === run.zadatak);
    if (zadatak) zadatak.ucinjeno++;
  }

  if (!JEZGRA.jeCiklus(cfg)) {
    javi(bio, null);
    run.faza = null;                  // ručni timer nema što slijediti
    pustiBudan(); syncLive(); save(); paint();
    return;
  }

  const dalje = JEZGRA.sljedeca(cfg, bio, run.krug);
  run.faza = dalje.faza;
  run.krug = dalje.krug;
  run.ostatak = null;

  javi(bio, dalje.faza);

  // Jedina razlika između `auto` i `full`: tko pritisne dalje.
  if (cfg.nacin === 'full') { pustiZvuk(); kreni(dalje.faza); }
  else { pustiBudan(); syncLive(); save(); paint(); }
}

/**
 * Povratak nakon dugog izbivanja.
 *
 * Obradi se **točno jedna** istekla faza, pa se stane. Namotavanje
 * kroz cijelo razdoblje ujutro bi javilo trideset odrađenih krugova
 * kojih nema — pomodoro se broji kad ga odradiš.
 */
function uhvatiPropusteno() {
  if (!run.faza || run.ostatak != null || run.endsAt == null) return;
  if (run.endsAt > sada()) return;

  const zaostalo = sada() - run.endsAt;
  zavrsiFazu();
  if (run.endsAt != null && run.endsAt <= sada()) {
    run.endsAt = null;
    run.ostatak = null;
    clearTimeout(backstop);
    pustiBudan();
    save();
  }
  if (zaostalo > 60000) poruka(t('isteklo'));
  paint();
}

/* ═══════════════════════════════════════════════════════════
   6 · Ručno trajanje

   Klizač ne ide po sekundi nego po popisu okruglih vrijednosti —
   gušće na kratkom kraju, gdje se i bira. Tako je i na mobitelu
   svaka pozicija upotrebljiva, bez preciznog pogađanja.
   ═══════════════════════════════════════════════════════════ */

const STOPS = [
  30, 45, 60, 90, 120, 150, 180, 240, 300, 360, 420, 480, 540, 600,
  720, 900, 1080, 1200, 1500, 1800, 2100, 2400, 2700, 3000, 3600,
  4200, 4800, 5400
];

const PRESETI = [300, 900, 1500];

els.klizac.max = String(STOPS.length - 1);

/** Najbliža stopa danom broju sekundi — klizač zna samo indekse. */
const indeksStope = (sek) => {
  let najbolji = 0;
  for (let i = 1; i < STOPS.length; i++) {
    if (Math.abs(STOPS[i] - sek) < Math.abs(STOPS[najbolji] - sek)) najbolji = i;
  }
  return najbolji;
};

function crtajTrajanje() {
  const rucno = !JEZGRA.jeCiklus(cfg);
  els.trajanje.hidden = !rucno;
  if (!rucno) return;

  const kutija = els.trajanje.querySelector('[data-presetovi]');
  kutija.replaceChildren(...PRESETI.map((sek) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = `${sek / 60} ${t('min')}`;
    b.setAttribute('aria-pressed', String(cfg.rucnoSek === sek));
    b.addEventListener('click', () => postaviRucno(sek));
    return b;
  }));

  els.klizac.value = String(indeksStope(cfg.rucnoSek));
  // Mijenjati trajanje ispod odbrojavanja koje teče znači ili izgubiti
  // napredak ili lagati o njemu; lakše je tražiti da prvo staneš.
  const tece = run.faza && (run.endsAt != null || run.ostatak != null);
  els.klizac.disabled = Boolean(tece);
  for (const b of kutija.children) b.disabled = Boolean(tece);
}

function postaviRucno(sek) {
  cfg.rucnoSek = Math.max(5, Math.round(sek));
  save();
  crtajTrajanje();
  paint();
}

els.klizac.addEventListener('input', () => postaviRucno(STOPS[Number(els.klizac.value)]));

/* ═══════════════════════════════════════════════════════════
   7 · Načini
   ═══════════════════════════════════════════════════════════ */

const NACINI = [
  { id: 'auto', kljuc: 'nacinAuto' },
  { id: 'full', kljuc: 'nacinFull' },
  { id: 'rucno', kljuc: 'nacinRucno' }
];

const oznakaNacina = document.querySelector('[data-nacin-oznaka]');

const crtajNacine = () => {
  oznakaNacina.textContent = t(NACINI.find((n) => n.id === cfg.nacin)?.kljuc || 'nacin');
};

/**
 * Promjena načina uvijek zaustavlja ono što teče.
 *
 * Prijelaz iz ciklusa u ručno nema smisleno „nastavi" — faza koja je
 * tekla ne postoji u novom načinu, a i trajanje joj je drugo.
 */
function postaviNacin(id) {
  if (!NACINI.some((n) => n.id === id) || cfg.nacin === id) return;
  const bioCiklus = JEZGRA.jeCiklus(cfg);
  cfg.nacin = id;
  if (bioCiklus !== JEZGRA.jeCiklus(cfg)) reset(); else { save(); }
  // Tema mora pristajati novom načinu — `applyTheme` sama pada na prvu
  // kompatibilnu ako zatečena to nije.
  if (!temaVrijedi(cfg.tema, cfg.nacin)) applyTheme(cfg.tema);
  crtajNacine();
  crtajTrajanje();
  crtajPostavke();
  postaviPrikaz(prikazId());
}

/* ═══════════════════════════════════════════════════════════
   8 · Ladica postavki
   ═══════════════════════════════════════════════════════════ */

const kutijaPostavki = document.querySelector('[data-postavke]');

function polje(naslovKljuc, ...djeca) {
  const el = document.createElement('div');
  el.className = 'polje';
  const ime = document.createElement('p');
  ime.className = 'polje-ime';
  ime.textContent = t(naslovKljuc);
  el.append(ime, ...djeca);
  return el;
}

function cipovi(izbori, aktivan, odabir) {
  const el = document.createElement('div');
  el.className = 'cipovi';
  el.replaceChildren(...izbori.map((izbor) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-pressed', String(izbor.id === aktivan));
    if (izbor.cipovi) {
      b.className = 'cip-tema';
      b.innerHTML = izbor.cipovi.map((boja) => `<i style="background:${boja}"></i>`).join('')
        + `<span>${t(izbor.kljuc)}</span>`;
    } else {
      // Nazivi jezika i brojke brzine se ne prevode — „Deutsch" je
      // „Deutsch" na svakom jeziku, a „60×" je 60×.
      b.textContent = izbor.ime || t(izbor.kljuc);
    }
    b.addEventListener('click', () => odabir(izbor.id));
    return b;
  }));
  return el;
}

/** Redak s brojem i dvama gumbima — bez tipkovnice, za prst. */
function brojcanik(imeKljuc, vrijednost, min, max, jedinica, promjena) {
  const el = document.createElement('div');
  el.className = 'broj';
  el.innerHTML = `
    <span class="broj-ime"></span>
    <span class="broj-kontrola">
      <button type="button" data-manje aria-label="−">−</button>
      <span class="broj-vrijednost"></span>
      <button type="button" data-vise aria-label="+">+</button>
    </span>`;
  el.querySelector('.broj-ime').textContent = t(imeKljuc);
  el.querySelector('.broj-vrijednost').textContent = jedinica ? `${vrijednost} ${t(jedinica)}` : vrijednost;
  const manje = el.querySelector('[data-manje]');
  const vise = el.querySelector('[data-vise]');
  manje.disabled = vrijednost <= min;
  vise.disabled = vrijednost >= max;
  manje.addEventListener('click', () => promjena(Math.max(min, vrijednost - 1)));
  vise.addEventListener('click', () => promjena(Math.min(max, vrijednost + 1)));
  return el;
}

/** Redak s prekidačem. `role="switch"` da čitač zaslona javi stanje. */
function prekidac(imeKljuc, vrijednost, promjena) {
  const el = document.createElement('div');
  el.className = 'broj';
  el.innerHTML = `<span class="broj-ime"></span>
    <button class="sklopka" type="button" role="switch"><i></i></button>`;
  el.querySelector('.broj-ime').textContent = t(imeKljuc);
  const gumb = el.querySelector('.sklopka');
  gumb.setAttribute('aria-checked', String(Boolean(vrijednost)));
  gumb.addEventListener('click', () => promjena(!vrijednost));
  return el;
}

function crtajPostavke() {
  const polja = [];

  polja.push(polje('nacin', cipovi(NACINI, cfg.nacin, postaviNacin)));

  polja.push(polje('prikaz', cipovi(
    dopusteni().map((id) => ({ id, kljuc: id })), prikazId(), postaviPrikaz)));

  // Trajanja ciklusa nemaju što raditi u ručnom načinu — ondje trajanje
  // zadaje klizač na glavnom ekranu, svaki put iznova.
  if (JEZGRA.jeCiklus(cfg)) {
    const postavi = (kljuc) => (v) => {
      cfg[kljuc] = v;
      save();
      crtajPostavke();
      postaviPrikaz(prikazId());     // traka gradi segmente iz trajanja
      paint();
    };
    polja.push(polje('trajanja',
      brojcanik('radMin', cfg.rad, 1, 90, 'min', postavi('rad')),
      brojcanik('kratkaMin', cfg.kratka, 1, 30, 'min', postavi('kratka')),
      brojcanik('dugaMin', cfg.duga, 1, 60, 'min', postavi('duga')),
      brojcanik('krugova', cfg.ciklus, 2, 8, null, postavi('ciklus'))));
  }

  // Napredak ima smisla samo u znamenki — ostali prikazi napredak
  // crtaju svojim oblikom, pa im izbor ne bi imao što promijeniti.
  if (prikazId() === 'znamenka') {
    polja.push(polje('napredak', cipovi(
      NAPREDAK.map((id) => ({ id, kljuc: `${id}Napredak` })), nacinNapretka(), (id) => {
        cfg.napredak = id; save(); crtajPostavke(); paint();
      })));
  }

  const zvucnaPolja = [prekidac('zvukUkljucen', cfg.zvuk, (v) => {
    cfg.zvuk = v; save(); if (v) zakaziZvuk(); else otkaziZvuk(); osvjeziPostavke();
  })];

  // Podopcije se pokazuju samo kad zvuk uopće svira — inače su kontrole
  // koje ništa ne rade. Isto vrijedi za brojke ispod svog prekidača.
  if (cfg.zvuk) {
    zvucnaPolja.push(prekidac('odbrojIme', cfg.odbroj, (v) => {
      cfg.odbroj = v; save(); zakaziZvuk(); osvjeziPostavke();
    }));
    if (cfg.odbroj) {
      zvucnaPolja.push(polje('odbrojSekIme', cipovi(
        ODBROJ.map((v) => ({ id: v, ime: `${v} s` })), Number(cfg.odbrojSek), (v) => {
          cfg.odbrojSek = v; save(); zakaziZvuk(); osvjeziPostavke();
        })), );
    }
    zvucnaPolja.push(prekidac('najavaIme', cfg.najava, (v) => {
      cfg.najava = v; save(); zakaziZvuk(); osvjeziPostavke();
    }));
    if (cfg.najava) {
      zvucnaPolja.push(polje('najavaMinIme', cipovi(
        NAJAVA.map((v) => ({ id: v, ime: `${v} ${t('min')}` })), Number(cfg.najavaMin), (v) => {
          cfg.najavaMin = v; save(); zakaziZvuk(); osvjeziPostavke();
        })));
    }
  }
  polja.push(polje('zvukNaslov', ...zvucnaPolja));

  polja.push(polje('ekran', prekidac('ekranBudan', cfg.budan, (v) => {
    cfg.budan = v; save(); if (v) drziBudan(); else pustiBudan(); osvjeziPostavke();
  })));

  polja.push(polje('tema', cipovi(temeZa(cfg.nacin), cfg.tema, applyTheme)));
  polja.push(polje('jezik', cipovi(
    Object.entries(LANGS).map(([id, ime]) => ({ id, ime })), lang, setLang)));

  // Ubrzava sat, ne skraćuje trajanja: krug i dalje piše 25:00 i prolazi
  // kroz sve svoje signale, samo brže. Za probu, pa stoji na dnu.
  polja.push(polje('razvoj', cipovi(
    BRZINE.map((v) => ({ id: v, ime: `${v}×` })), brzina(), postaviBrzinu)));

  kutijaPostavki.replaceChildren(...polja);
}

const ladicaOtvorena = () => els.ladica.getAttribute('aria-hidden') === 'false';

/**
 * Precrtaj postavke ako su otvorene.
 *
 * Bez ovoga svaka postavka koja se ne mijenja kroz `crtajPostavke`
 * mijenja stanje alata, ali ne i ono što ladica pokazuje — odabir se
 * primijeni, a označen ostane stari, dok ladicu ne zatvoriš i otvoriš.
 * Zato ovo zovu **svi** postavljači, ne samo neki.
 */
const osvjeziPostavke = () => { if (ladicaOtvorena()) crtajPostavke(); };

const otvoriLadicu = () => { crtajPostavke(); els.ladica.setAttribute('aria-hidden', 'false'); };
const zatvoriLadicu = () => els.ladica.setAttribute('aria-hidden', 'true');

document.getElementById('postavke').addEventListener('click', otvoriLadicu);
document.getElementById('zatvori').addEventListener('click', zatvoriLadicu);
els.ladica.addEventListener('click', (e) => { if (e.target === els.ladica) zatvoriLadicu(); });

/* ═══════════════════════════════════════════════════════════
   9 · Crtanje
   ═══════════════════════════════════════════════════════════ */

/**
 * Natpis glavnog gumba je jedino mjesto gdje se razlika između auto i
 * full auto vidi bez čekanja: u auto načinu gumb imenuje fazu koja
 * čeka tvoj pristanak.
 */
function natpisGumba(s) {
  if (s.pripremljeno) els.go.textContent = `${t('kreni')} · ${t(s.faza)}`;
  else if (s.pauzirano) els.go.textContent = t('nastavi');
  else if (s.mirno) els.go.textContent = t('kreni');
  else els.go.textContent = t('pauza');
}

function paint(s = JEZGRA.stanje(cfg, run, sada())) {
  // Ništa se ne crta dok DOM ne odgovara odabiru. Pokriva oba slučaja:
  // podizanje, gdje tema traži crtanje prije prvog `mount`, i promjenu
  // načina, gdje `prikazId()` odskoči na drugu obitelj prije montiranja.
  if (montiran !== prikazId()) return;
  const boja = bojaStanja(s);
  document.body.style.setProperty('--faza-boja', boja);
  // U mirnom stanju gumb ostaje u boji rada — sljedeće što slijedi jest rad.
  document.body.style.setProperty('--go-boja', s.faza ? boja : 'var(--rad)');
  prikaz().paint(s);
  natpisGumba(s);
  els.skip.hidden = !s.ciklus;       // ručni timer nema što preskočiti
  crtajZadatke();
  crtajTjedan();
}

function petlja() {
  /* Sljedeći okvir se zakazuje **prije** posla, ne poslije.
     Sa zakazivanjem na kraju jedna iznimka u crtanju zauvijek ubije
     odbrojavanje, a jedini vidljiv trag je brojka koja stoji — i djeluje
     kao da se osvježava tek na pauzu, jer `pauziraj()` crta izravno. */
  requestAnimationFrame(petlja);

  const s = JEZGRA.stanje(cfg, run, sada());
  if (!s.mirno && !s.pripremljeno && !s.pauzirano && s.preostalo <= 0) return zavrsiFazu();

  const sekunda = Math.ceil(s.preostalo / 1000);
  // Tekst se prepisuje tek kad se prikazana sekunda promijeni.
  if (sekunda !== zadnjaSekunda) { zadnjaSekunda = sekunda; paint(s); }
}

/* ═══════════════════════════════════════════════════════════
   10 · Veze
   ═══════════════════════════════════════════════════════════ */

function glavni() {
  const s = JEZGRA.stanje(cfg, run, sada());
  if (s.mirno || s.pripremljeno || s.pauzirano) kreni();
  else pauziraj();
}

els.go.addEventListener('click', glavni);
els.skip.addEventListener('click', preskoci);
els.reset.addEventListener('click', () => { reset(); crtajTrajanje(); });

addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'escape') return zatvoriLadicu();
  if (els.ladica.getAttribute('aria-hidden') === 'false') return;
  if (e.code === 'Space') { e.preventDefault(); glavni(); }
  else if (k === 's') preskoci();
  else if (k === 'r') { reset(); crtajTrajanje(); }
  else if (k === 't') {
    const izbor = temeZa(cfg.nacin);
    applyTheme(izbor[(izbor.findIndex((x) => x.id === cfg.tema) + 1) % izbor.length].id);
  }
  else if (dopusteni()[Number(k) - 1]) postaviPrikaz(dopusteni()[Number(k) - 1]);
});

addEventListener('visibilitychange', () => { if (!document.hidden) uhvatiPropusteno(); });

/* ═══════════════════════════════════════════════════════════
   11 · Start
   ═══════════════════════════════════════════════════════════ */

applyTheme(cfg.tema);
applyLang();
uhvatiPropusteno();
naoruzaj();
requestAnimationFrame(petlja);
</script>

</body>
</html>
