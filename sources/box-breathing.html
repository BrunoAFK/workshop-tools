<title>Box disanje — vođeni ritam 4-4-4-4</title>
<style>
/* ═══════════════════════════════════════════════════════════
   BOX DISANJE

   Sve je smireno namjerno: meki tonovi, spori prijelazi, ništa
   što trza. Jedina stvar koja se kreće je točka po kvadratu.
   ═══════════════════════════════════════════════════════════ */

:root {
  --sans: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
  --num: "DIN Alternate", "Helvetica Neue", Helvetica, Arial, sans-serif;

  --r: 16px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;
  --ctl: 44px;
  --ease: cubic-bezier(.4, 0, .2, 1);
}

/* ── Svjetlo (zadano): papir i kadulja ── */
html[data-theme="svjetlo"] {
  --bg: #f4f6f2; --bg-2: #eaeee6; --panel: #ffffff; --panel-2: #f0f3ec;
  --fg: #1e2620; --fg-2: #55625a; --fg-3: #8b968f;
  --line: #dde3d9; --line-2: #c6d0c2;
  --accent: #4e8c66;
  --track: #dfe6da;
  --inhale: #3f8f6b; --hold: #6a9c86; --exhale: #4a7fa0; --done: #b06a3f;
  --on-accent: #ffffff;
  --shadow: 0 18px 44px -28px rgba(30, 38, 32, .5);
}

/* ── Tamno: kasna večer ── */
html[data-theme="tamno"] {
  --bg: #121614; --bg-2: #181d1a; --panel: #1d2320; --panel-2: #252c28;
  --fg: #e8eee9; --fg-2: #9daba3; --fg-3: #6d7a72;
  --line: #29312d; --line-2: #3a443e;
  --accent: #6fc196;
  --track: #29312d;
  --inhale: #6fc196; --hold: #86ae9d; --exhale: #7fb3d0; --done: #d9926a;
  --on-accent: #10201a;
  --shadow: 0 18px 44px -26px rgba(0, 0, 0, .7);
}

/* ── Zeleno: puna boja, najmirnije ── */
html[data-theme="zeleno"] {
  --bg: #17352a; --bg-2: #1d4033; --panel: #22493a; --panel-2: #2a5644;
  --fg: #eaf5ef; --fg-2: #a9cbba; --fg-3: #7ba895;
  --line: #2c5b48; --line-2: #3a6e58;
  --accent: #8ad8ac;
  --track: #2c5b48;
  --inhale: #8ad8ac; --hold: #9fd0bd; --exhale: #8fc9dd; --done: #e0a87e;
  --on-accent: #123026;
  --shadow: 0 18px 44px -26px rgba(0, 0, 0, .45);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* Atribut `hidden` mora nadjačati svaki `display` iz ovih pravila —
   inače se skriveni redak seanse i dalje crta. */
[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  overflow: hidden;
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  transition: background .6s var(--ease), color .6s var(--ease);
}

button { font: inherit; color: inherit; cursor: pointer; }

/* ═══ RASPORED ═════════════════════════════════════════════ */

.app {
  display: grid;
  height: 100dvh;
  padding: calc(var(--sp-4) + env(safe-area-inset-top)) var(--sp-4)
           calc(var(--sp-6) + env(safe-area-inset-bottom));
  gap: var(--sp-3);
  grid-template-rows: auto minmax(0, 1fr) auto;
  max-width: 720px;
  margin: 0 auto;
}

/* ── gornji red ── */

.top { display: flex; gap: var(--sp-2); align-items: center; }
.patterns { display: flex; flex: 1; gap: var(--sp-1); min-width: 0; }

.pattern {
  flex: 1;
  min-width: 0;
  height: var(--ctl);
  padding: 0 var(--sp-1);
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  background: var(--panel);
  font-size: .78rem;
  font-weight: 600;
  white-space: nowrap;
  transition: background .3s var(--ease), border-color .3s var(--ease), color .3s var(--ease);
}

.pattern[aria-pressed="true"] { border-color: var(--accent); color: var(--on-accent); background: var(--accent); }

.icon {
  display: grid;
  flex: 0 0 auto;
  width: var(--ctl);
  height: var(--ctl);
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  color: var(--fg-2);
  background: var(--panel);
  place-items: center;
}

.icon svg { width: 19px; height: 19px; }

/* ── kvadrat ── */

.stage {
  container-type: size;
  display: grid;
  min-height: 0;
  place-items: center;
}

.box-wrap {
  position: relative;
  width: min(92cqw, 78cqh);
  aspect-ratio: 1;
}

.box { display: block; width: 100%; height: 100%; overflow: visible; }

.box-track { fill: none; stroke: var(--track); stroke-width: 2.4; stroke-linejoin: round; }

.box-trace {
  fill: none;
  stroke: var(--phase, var(--accent));
  stroke-width: 3.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke .8s var(--ease);
}

.box-dot {
  fill: var(--phase, var(--accent));
  transition: fill .8s var(--ease);
}

/* Natpis i brojka stoje u sredini kvadrata. */
.readout {
  position: absolute;
  inset: 0;
  display: grid;
  gap: var(--sp-1);
  align-content: center;
  justify-items: center;
  pointer-events: none;
}

.phase-name {
  color: var(--fg-2);
  font-size: clamp(.8rem, 4.5cqw, 1.4rem);
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  transition: color .5s var(--ease);
}

.phase-count {
  color: var(--phase, var(--accent));
  font-family: var(--num);
  font-size: clamp(2.4rem, 17cqw, 6rem);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  transition: color .8s var(--ease);
}

.cycles {
  color: var(--fg-3);
  font-size: clamp(.62rem, 2.6cqw, .78rem);
  letter-spacing: .14em;
  text-transform: uppercase;
}

/* ── donji red ── */

.bottom { display: grid; gap: var(--sp-3); }

/* Trajanje seanse se bira ovdje, dodirom — nije postavka nego odluka
   koja se donosi pred samu vježbu. */
.session {
  display: flex;
  gap: var(--sp-3);
  align-items: center;
  width: 100%;
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  background: var(--panel);
  text-align: left;
}

/* Sat u traci kontrola pokazuje je li seansa uopće postavljena. */
#sessionBtn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

.session-label { color: var(--fg-3); font-size: .62rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.session-time { font-family: var(--num); font-size: 1.1rem; font-weight: 600; font-variant-numeric: tabular-nums; }

.session-bar { display: block; flex: 1; height: 5px; border-radius: 99px; background: var(--track); overflow: hidden; }
.session-bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .3s linear; }

.controls { display: flex; gap: var(--sp-2); align-items: stretch; }

.go {
  display: flex;
  gap: var(--sp-2);
  align-items: center;
  justify-content: center;
  flex: 1;
  min-width: 0;
  padding: var(--sp-4) var(--sp-3);
  border: 0;
  border-radius: var(--r);
  color: var(--on-accent);
  background: var(--accent);
  font-size: 1.02rem;
  font-weight: 700;
  transition: background .4s var(--ease), transform .1s;
}

.go:active { transform: scale(.99); }
.go svg { width: 22px; height: 22px; }

.controls .icon { flex: 0 0 auto; width: 58px; height: auto; }

/* ═══ POSTAVKE ═════════════════════════════════════════════ */

.sheet {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  padding: var(--sp-4);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  visibility: hidden;
  opacity: 0;
  place-items: center;
  transition: opacity .3s var(--ease), visibility .3s;
}

.sheet.on { visibility: visible; opacity: 1; }

.sheet-box {
  width: min(440px, 100%);
  max-height: calc(100dvh - var(--sp-6));
  overflow-y: auto;
  border: 1px solid var(--line-2);
  border-radius: 20px;
  background: var(--bg-2);
  box-shadow: var(--shadow);
}

.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-4) var(--sp-4) var(--sp-2); }
.sheet-head h2 { margin: 0; font-size: 1rem; font-weight: 700; }

.field { padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--line); }
.field-row { display: flex; gap: var(--sp-3); align-items: center; justify-content: space-between; }
.field-row + .field-row { margin-top: var(--sp-3); }
.field label { font-size: .9rem; }
.field small { display: block; margin-top: 2px; color: var(--fg-3); font-size: .74rem; line-height: 1.4; }
.field-title { margin: 0 0 var(--sp-3); font-size: .9rem; font-weight: 600; }

.picks { display: grid; gap: var(--sp-2); grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); }

.pick {
  padding: var(--sp-2);
  border: 1px solid var(--line-2);
  border-radius: 12px;
  background: var(--panel);
  font-size: .76rem;
  font-weight: 600;
}

.pick[aria-pressed="true"] { border-color: var(--accent); color: var(--on-accent); background: var(--accent); }

.sw { position: relative; flex: 0 0 auto; width: 50px; height: 30px; padding: 0; border: 0; border-radius: 99px; background: var(--track); transition: background .3s; }
.sw::after {
  position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
  border-radius: 50%; background: var(--fg-3); content: "";
  transition: transform .3s var(--ease), background .3s;
}
.sw[aria-checked="true"] { background: color-mix(in srgb, var(--accent) 40%, transparent); }
.sw[aria-checked="true"]::after { background: var(--accent); transform: translateX(20px); }

.btn { width: 100%; padding: 12px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--panel); font-size: .86rem; font-weight: 600; }
.btn:active { background: var(--panel-2); }
.hint { margin: var(--sp-2) 0 0; color: var(--fg-3); font-size: .74rem; line-height: 1.5; }

@media (max-height: 560px) and (orientation: landscape) {
  .app { grid-template-columns: minmax(0, 1fr) minmax(240px, 300px); grid-template-rows: auto minmax(0, 1fr); }
  .top { grid-column: 1 / -1; }
  .stage { grid-row: 2; }
  .bottom { grid-row: 2; align-content: center; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body data-theme="svjetlo">

<div class="app">

</div>

<!-- ═══ SEANSA ═════════════════════════════════════════════ -->

  <div class="sheet-box">

<script>
(() => {
'use strict';

const $ = (id) => document.getElementById(id);
const els = {
  root: document.documentElement, body: document.body,
  patterns: $('patterns'), trace: $('trace'), dot: $('dot'),
  phaseName: $('phaseName'), phaseCount: $('phaseCount'), cycles: $('cycles'),
  sessionLabel: $('sessionLabel'), sessionFill: $('sessionFill'), sessionTime: $('sessionTime'),
  go: $('go'), goIcon: $('goIcon'), goLabel: $('goLabel'), resetBtn: $('resetBtn'),

/* ═══════════════════════════════════════════════════════════
   1 · Postavke
   ═══════════════════════════════════════════════════════════ */

const STORE = 'workshop.box';
const DEFAULTS = {
  phases: [4, 4, 4, 4], session: 0, theme: 'svjetlo', lang: null, voice: 'dah',
  sound: true, vibrate: true, countdown: true, keepAwake: true
};

let cfg = { ...DEFAULTS };
try { cfg = { ...DEFAULTS, ...JSON.parse(localStorage.getItem(STORE) || '{}') }; } catch { /* prvi put */ }
if (!Array.isArray(cfg.phases) || cfg.phases.length !== 4) cfg.phases = [...DEFAULTS.phases];

const save = () => { try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch { /* privatni način */ } };

/* ═══════════════════════════════════════════════════════════
   2 · Jezici
   ═══════════════════════════════════════════════════════════ */

const LANGS = { hr: 'Hrvatski', en: 'English', de: 'Deutsch' };

const STRINGS = {

    sessionHint: 'Bez kraja: vježbaš dok sam ne staneš, bez trake napretka.', sessionShort: 'Seansa', unlimited: 'Bez kraja',

    themeLight: 'Svjetlo', themeDark: 'Tamno', themeGreen: 'Zeleno',
    sound: 'Zvučni signal', soundHint: 'Uzlazni ton na udah, silazni na izdah.',
    vibrate: 'Vibracija', vibrateHint: 'Kratki dodir na svaku promjenu faze.',
    countdown: 'Odbrojavanje sekundi', countdownHint: 'Brojka u sredini kvadrata.',
    keepAwake: 'Drži ekran upaljen', testSound: 'Provjeri zvuk',
    audioHint: 'Na mobitelu se zvuk otključava tek prvim dodirom — pritisni ovo jednom prije početka.'
  },
  en: {

/* ═══════════════════════════════════════════════════════════
   3 · Zvuk

   Ton klizi gore na udahu i dolje na izdahu — visina prati smjer
   daha, pa se ritam može držati i zatvorenih očiju. Zadržavanje
   dobiva jedan tih, ravan ton.
   ═══════════════════════════════════════════════════════════ */

let audio = null;

function wakeAudio() {
  if (!audio) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audio = new Ctx();
  }
  if (audio.state === 'suspended') audio.resume();
  return audio;
}

/**
 * Klizni ton koji traje točno koliko i faza.
 *
 * Na udahu glasnoća raste od tišine do vrhunca na kraju, na izdahu
 * pada obrnuto — ton tako sam vodi dah, a ne samo najavljuje promjenu.
 * Zadržavanje dobiva kratak, tih i ravan ton.
 */
/**
 * Glasovi.
 *
 * Svaki je opisan putanjom od početka do kraja: `gain` je glasnoća,
 * `freq` je visina tona ili, kod šuma, granica filtra. Udah svira
 * putanju naprijed, izdah unatrag — isti materijal, obrnut smjer.
 *
 * Vrijednosti za „dah" došle su iz bencha za ugađanje.
 */
const VOICES = ['gong', 'zdjela', 'dah', 'meki', 'sinus', 'zvono', 'val'];

/**
 * Udareni glasovi.
 *
 * Gong nije naraslica nego udarac koji odzvanja, pa se ne gradi od
 * jednog izvora s ovojnicom, nego od više parcijala odjednom. Ključno
 * je da odnosi među njima **nisu** cijeli brojevi — kod harmoničnog
 * niza uho čuje orgulje, a tek neharmoničan daje metal. Viši parcijali
 * se gase brže, zbog čega udarac s vremenom potamni.
 */
const STRUCK = {
  gong: {
    partials: [
      { ratio: 1,    gain: 1,    decay: 1    },
      { ratio: 1.52, gain: 0.55, decay: 0.72 },
      { ratio: 2.13, gain: 0.38, decay: 0.55 },
      { ratio: 2.85, gain: 0.26, decay: 0.42 },
      { ratio: 3.46, gain: 0.18, decay: 0.32 },
      { ratio: 4.36, gain: 0.12, decay: 0.24 }
    ],
    tail: 11, detune: 4, peak: 0.16
  },
  zdjela: {
    partials: [
      { ratio: 1,    gain: 1,    decay: 1    },
      { ratio: 2.02, gain: 0.5,  decay: 0.78 },
      { ratio: 3.01, gain: 0.28, decay: 0.6  },
      { ratio: 4.07, gain: 0.16, decay: 0.45 },
      { ratio: 5.12, gain: 0.09, decay: 0.32 }
    ],
    tail: 15, detune: 2, peak: 0.14
  }
};

const VOICE_SPECS = {
  dah:   { wave: 'noise',    filter: 'lowpass', q: 2.3, gain: [0.0102, 0.0973], freq: [550, 1413] },
  meki:  { wave: 'pink',     filter: 'lowpass', q: 1.1, gain: [0.03, 0.22],     freq: [420, 1250] },
  // Udareni: `freq` je osnovna visina udaha odnosno izdaha — izdah niže,
  // pa se smjer daha čuje i bez klizanja.
  gong:   { struck: 'gong',   freq: [147, 110] },
  zdjela: { struck: 'zdjela', freq: [294, 220] },
  sinus: { wave: 'sine',     filter: 'off',     q: 1,   gain: [0.04, 0.13],     freq: [220, 330] },
  zvono: { wave: 'triangle', filter: 'off',     q: 1,   gain: [0.04, 0.12],     freq: [220, 330] },
  val:   { wave: 'sine',     filter: 'off',     q: 1,   gain: [0.04, 0.13],     freq: [275, 275] }
};

let tone = null;
const noiseCache = {};

/**
 * Šum, napravljen jednom po vrsti i posuđivan.
 *
 * Bijeli ima jednaku snagu na svim frekvencijama pa siče; ružičasti
 * pada 3 dB po oktavi, što je raspodjela kakvu imaju vjetar, more i
 * dah. Za disanje je gotovo uvijek ružičasti bliži cilju.
 */
function noiseBuffer(ctx, kind = 'white') {
  if (noiseCache[kind]) return noiseCache[kind];
  const frames = ctx.sampleRate * 2;
  const buffer = ctx.createBuffer(1, frames, ctx.sampleRate);
  const data = buffer.getChannelData(0);

  if (kind === 'pink') {
    // Paul Kellet, filtar u nizu — jeftina i dovoljno vjerna ružičasta.
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < frames; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179;
      b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520;
      b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522;
      b5 = -0.7616 * b5 - w * 0.0168980;
      data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
      b6 = w * 0.115926;
    }
  } else {
    for (let i = 0; i < frames; i++) data[i] = Math.random() * 2 - 1;
  }

  noiseCache[kind] = buffer;
  return buffer;
}

function stopTone() {
  if (!tone) return;
  const source = tone;
  tone = null;
  try { source.stop(); } catch { /* već gotov */ }
}

/* Udarci se ne prekidaju sljedećom fazom — gong koji se presiječe na
   promjeni zvuči prekratko, a u stvarnosti odzvanja preko nje. Gase se
   samo na pauzu, reset i kraj. */
let strikes = [];

function stopStrikes() {
  for (const strike of strikes) strike();
  strikes = [];
}

const stopAll = () => { stopTone(); stopStrikes(); };

/**
 * Odsvira glas kroz zadano trajanje.
 *
 * `reverse` obrće i glasnoću i putanju filtra — izdah je udah unatrag.
 * `level` skalira glasnoću, za tiho zadržavanje.
 */
/**
 * Jedan udarac: svi parcijali krenu zajedno i gase se svaki svojim
 * tempom. Kratak napad je ono što ga čini udarcem, a ne puhanjem.
 */
function playStruck(name, freq, seconds, level) {
  const ctx = wakeAudio();
  if (!ctx) return;
  const kit = STRUCK[name];
  const at = ctx.currentTime;
  // Rep je svojstvo instrumenta, ne faze — ne skraćuje se na njezinu duljinu.
  const tail = kit.tail;
  const nodes = [];

  for (const [index, partial] of kit.partials.entries()) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    // Blagi razmak od čiste visine daje treperenje pravog metala.
    osc.frequency.setValueAtTime(freq * partial.ratio, at);
    osc.detune.setValueAtTime((index % 2 ? 1 : -1) * kit.detune * index, at);

    const peak = Math.max(0.0002, kit.peak * partial.gain * level);
    const life = Math.max(0.25, tail * partial.decay);
    gain.gain.setValueAtTime(0.0001, at);
    gain.gain.linearRampToValueAtTime(peak, at + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + life);

    osc.connect(gain).connect(ctx.destination);
    osc.start(at);
    osc.stop(at + life + 0.05);
    nodes.push(osc);
  }

  // Sve parcijale gasi jedan potez, ali tek kad se to izrijekom zatraži.
  const kill = () => { for (const osc of nodes) { try { osc.stop(); } catch { /* gotov */ } } };
  strikes.push(kill);
  nodes[0].addEventListener('ended', () => { strikes = strikes.filter((item) => item !== kill); });
}

function playVoice(seconds, reverse, level = 1) {
  const ctx = wakeAudio();
  if (!ctx || seconds <= 0) return;
  stopTone();

  const spec = VOICE_SPECS[cfg.voice] || VOICE_SPECS.dah;

  if (spec.struck) {
    // Prethodni udarac se pušta da odzvoni; presijeca ga samo novi na
    // istoj visini, da se isti ton ne gomila preko sebe.
    playStruck(spec.struck, reverse ? spec.freq[1] : spec.freq[0], seconds, level);
    return;
  }

  const at = ctx.currentTime;
  const [g0, g1] = reverse ? [spec.gain[1], spec.gain[0]] : spec.gain;
  const [f0, f1] = reverse ? [spec.freq[1], spec.freq[0]] : spec.freq;

  let source;
  let out;
  if (spec.wave === 'noise' || spec.wave === 'pink') {
    source = ctx.createBufferSource();
    source.buffer = noiseBuffer(ctx, spec.wave === 'pink' ? 'pink' : 'white');
    source.loop = true;
    out = source;
  } else {
    const osc = ctx.createOscillator();
    osc.type = spec.wave;
    osc.frequency.setValueAtTime(f0, at);
    if (f1 !== f0) osc.frequency.linearRampToValueAtTime(f1, at + seconds);
    source = osc;
    out = osc;
  }

  if (spec.filter !== 'off') {
    const filter = ctx.createBiquadFilter();
    filter.type = spec.filter;
    filter.Q.value = spec.q;
    filter.frequency.setValueAtTime(f0, at);
    if (f1 !== f0) filter.frequency.linearRampToValueAtTime(f1, at + seconds);
    out.connect(filter);
    out = filter;
  }

  // Kratki rubovi da ton ne pukne na početku i kraju.
  const edge = Math.min(0.09, seconds * 0.06);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.linearRampToValueAtTime(g0 * level, at + edge);
  gain.gain.linearRampToValueAtTime(g1 * level, at + Math.max(edge, seconds - edge));
  gain.gain.linearRampToValueAtTime(0.0001, at + seconds);

  out.connect(gain).connect(ctx.destination);
  source.start(at);
  source.stop(at + seconds + 0.05);
  tone = source;
}

/** Udah ide naprijed, izdah unatrag, zadržavanje kratko i tiho. */
function phaseSound(index, seconds) {
  if (index === 0) playVoice(seconds, false);
  else if (index === 2) playVoice(seconds, true);
  else playVoice(Math.min(0.3, seconds), false, 0.45);
}

const endSound = () => {
  stopTone();
  playVoice(1.4, false, 1.2);
};

// Zatvaranje modala i kraj seanse ne smiju ostaviti gong da visi.
window.addEventListener('pagehide', stopAll);

/* ═══════════════════════════════════════════════════════════
   4 · Obrasci i seansa
   ═══════════════════════════════════════════════════════════ */

const PATTERNS = [
  { id: 'box4', phases: [4, 4, 4, 4], label: '4·4·4·4' },
  { id: 'box5', phases: [5, 5, 5, 5], label: '5·5·5·5' },
  { id: 'box6', phases: [6, 6, 6, 6], label: '6·6·6·6' },
  { id: 'relax', phases: [4, 7, 8, 0], label: '4·7·8' }
];

// Redom kojim ih gumb obilazi: bez kraja pa sve dulje seanse.
const SESSIONS = [0, 60, 120, 180, 300];

const samePhases = (a, b) => a.every((n, i) => n === b[i]);

function renderPatterns() {
  els.patterns.innerHTML = PATTERNS.map((p) =>
    `<button class="pattern" type="button" data-pattern="${p.id}" aria-pressed="${samePhases(p.phases, cfg.phases)}">${p.label}</button>`
  ).join('');
}

function renderPicks() {
  els.sessionPick.innerHTML = SESSIONS.map((secs) =>
    `<button class="pick" type="button" data-session="${secs}" aria-pressed="${secs === cfg.session}">${secs ? `${secs / 60} min` : t('unlimited')}</button>`
  ).join('');

  els.voicePick.innerHTML = VOICES.map((id) =>
    `<button class="pick" type="button" data-voice="${id}" aria-pressed="${id === cfg.voice}">${t('voice_' + id)}</button>`
  ).join('');

  els.themePick.innerHTML = [['svjetlo', 'themeLight'], ['tamno', 'themeDark'], ['zeleno', 'themeGreen']].map(([id, key]) =>
    `<button class="pick" type="button" data-theme="${id}" aria-pressed="${id === cfg.theme}">${t(key)}</button>`
  ).join('');

  els.langPick.innerHTML = Object.entries(LANGS).map(([code, name]) =>
    `<button class="pick" type="button" data-lang="${code}" aria-pressed="${code === cfg.lang}">${name}</button>`
  ).join('');
}

/* ═══════════════════════════════════════════════════════════
   5 · Vođenje

   Točka putuje po kvadratu, jedna stranica po fazi, i to od dna
   prema vrhu na udahu — smjer kretanja tako prati smjer daha.
   Vrijeme se čita iz sata; `requestAnimationFrame` samo crta.
   ═══════════════════════════════════════════════════════════ */

const SIDE = 80;                    // duljina stranice u koordinatama SVG-a
const PERIMETER = SIDE * 4;

// Redom: udah (lijevo, gore), zadrži (vrh, desno), izdah (desno, dolje), zadrži (dno, lijevo).
const CORNERS = [[10, 90], [10, 10], [90, 10], [90, 90], [10, 90]];
const PHASE_COLOR = ['var(--inhale)', 'var(--hold)', 'var(--exhale)', 'var(--hold)'];
const PHASE_KEY = ['inhale', 'hold', 'exhale', 'hold'];

let running = false;
let phase = 0;
let phaseStart = 0;                 // trenutak početka faze, ms
let sessionElapsed = 0;             // sekunde odrađene seanse
let sessionStart = 0;
let cycles = 0;
let frame = 0;
let phaseTimer = 0;

const phaseLength = (index) => Math.max(0, Number(cfg.phases[index]) || 0);

/** Prva sljedeća faza koja uopće traje — preskače zadržavanja od 0. */
function nextPhase(from) {
  for (let step = 1; step <= 4; step++) {
    const index = (from + step) % 4;
    if (phaseLength(index) > 0) return index;
  }
  return from;
}

function dotAt(index, progress) {
  const [x0, y0] = CORNERS[index];
  const [x1, y1] = CORNERS[index + 1];
  return [x0 + (x1 - x0) * progress, y0 + (y1 - y0) * progress];
}

function paint() {
  const length = phaseLength(phase);
  const progress = running && length > 0 ? Math.min(1, (Date.now() - phaseStart) / (length * 1000)) : 0;

  els.root.style.setProperty('--phase', running ? PHASE_COLOR[phase] : 'var(--accent)');
  els.phaseName.textContent = running ? t(PHASE_KEY[phase]) : (sessionDone() ? t('done') : t('ready'));

  const left = Math.max(0, Math.ceil(length - (Date.now() - phaseStart) / 1000));
  els.phaseCount.textContent = cfg.countdown ? (running ? left : length) : '';
  els.phaseCount.style.visibility = cfg.countdown ? 'visible' : 'hidden';

  const done = (phase + progress) * SIDE;
  els.trace.setAttribute('stroke-dashoffset', String(PERIMETER - done));
  const [x, y] = dotAt(phase, progress);
  els.dot.setAttribute('cx', x.toFixed(2));
  els.dot.setAttribute('cy', y.toFixed(2));

  const plural = cycles === 1 ? 'cycles1' : (cycles >= 2 && cycles <= 4 ? 'cycles2' : 'cyclesN');
  els.cycles.textContent = `${cycles} ${t(plural)}`;

  // Traka napretka postoji samo kad seansa ima kraj — inače nema što mjeriti.
  const spent = sessionElapsed + (running ? (Date.now() - sessionStart) / 1000 : 0);
  els.sessionRow.hidden = !cfg.session;
  els.sessionBtn.setAttribute('aria-pressed', String(Boolean(cfg.session)));
  if (cfg.session) {
    els.sessionTime.textContent = clock(Math.max(0, cfg.session - spent));
    els.sessionFill.style.width = `${Math.min(100, (spent / cfg.session) * 100)}%`;
  }

  // Nakon odrađene seanse gumb kreće ispočetka, pa i piše tako.
  els.goLabel.textContent = t(running ? 'pause' : (spent > 0 && !sessionDone() ? 'resume' : 'start'));
  els.goIcon.setAttribute('d', running ? 'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z' : 'M8 5v14l11-7z');
}

function clock(seconds) {
  const s = Math.max(0, Math.round(seconds));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

const sessionDone = () => Boolean(cfg.session) && sessionElapsed >= cfg.session;

function enterPhase(index) {
  phase = index;
  phaseStart = Date.now();
  if (index === 0) cycles += 1;
  if (cfg.sound) phaseSound(index, phaseLength(index));
  if (cfg.vibrate && navigator.vibrate) navigator.vibrate(index % 2 === 0 ? 40 : 18);
  clearTimeout(phaseTimer);
  phaseTimer = window.setTimeout(advance, phaseLength(index) * 1000);
}

function advance() {
  if (!running) return;
  const spent = sessionElapsed + (Date.now() - sessionStart) / 1000;
  if (cfg.session && spent >= cfg.session) { finish(); return; }
  enterPhase(nextPhase(phase));
}

function tick() {
  if (!running) return;
  paint();
  frame = requestAnimationFrame(tick);
}

function start() {
  wakeAudio();
  if (sessionDone()) reset();
  running = true;
  sessionStart = Date.now();
  requestWakeLock();
  enterPhase(phaseLength(phase) > 0 ? phase : nextPhase(phase));
  if (cycles === 0) cycles = 1;
  paint();
  frame = requestAnimationFrame(tick);
}

function pause() {
  running = false;
  cancelAnimationFrame(frame);
  clearTimeout(phaseTimer);
  stopAll();
  sessionElapsed += (Date.now() - sessionStart) / 1000;
  releaseWakeLock();
  paint();
}

function finish() {
  running = false;
  cancelAnimationFrame(frame);
  clearTimeout(phaseTimer);
  sessionElapsed = cfg.session || sessionElapsed;
  releaseWakeLock();
  if (cfg.sound) endSound();
  if (cfg.vibrate && navigator.vibrate) navigator.vibrate([120, 80, 120]);
  paint();
}

function reset() {
  running = false;
  cancelAnimationFrame(frame);
  clearTimeout(phaseTimer);
  stopAll();
  phase = 0;
  cycles = 0;
  sessionElapsed = 0;
  phaseStart = Date.now();
  releaseWakeLock();
  paint();
}

/* ═══════════════════════════════════════════════════════════
   6 · Ekran ostaje upaljen
   ═══════════════════════════════════════════════════════════ */

let lock = null;

async function requestWakeLock() {
  if (!cfg.keepAwake || !navigator.wakeLock || lock) return;
  try { lock = await navigator.wakeLock.request('screen'); } catch { /* nema podrške */ }
}

function releaseWakeLock() {
  if (lock) { lock.release().catch(() => {}); lock = null; }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !running) return;
  requestWakeLock();
  paint();
  cancelAnimationFrame(frame);
  frame = requestAnimationFrame(tick);
});

/* ═══════════════════════════════════════════════════════════
   7 · Veze sučelja
   ═══════════════════════════════════════════════════════════ */

els.go.addEventListener('click', () => (running ? pause() : start()));
els.resetBtn.addEventListener('click', reset);

const openSession = () => { els.sessionSheet.classList.add('on'); els.sessionSheet.setAttribute('aria-hidden', 'false'); };
const closeSession = () => { els.sessionSheet.classList.remove('on'); els.sessionSheet.setAttribute('aria-hidden', 'true'); };

els.sessionBtn.addEventListener('click', openSession);
els.sessionSheetClose.addEventListener('click', closeSession);
els.sessionSheet.addEventListener('click', (event) => { if (event.target === els.sessionSheet) closeSession(); });

els.sessionPick.addEventListener('click', (event) => {
  const button = event.target.closest('[data-session]');
  if (!button) return;
  cfg.session = Number(button.dataset.session);
  save();
  renderPicks();
  reset();
  closeSession();
});

els.voicePick.addEventListener('click', (event) => {
  const button = event.target.closest('[data-voice]');
  if (!button) return;
  cfg.voice = VOICES.includes(button.dataset.voice) ? button.dataset.voice : 'sinus';
  save();
  renderPicks();
  wakeAudio();
  phaseSound(0, 1.6);              // odmah se čuje što je odabrano
});

els.patterns.addEventListener('click', (event) => {
  const button = event.target.closest('[data-pattern]');
  if (!button) return;
  const found = PATTERNS.find((p) => p.id === button.dataset.pattern);
  if (!found) return;
  cfg.phases = [...found.phases];
  save();
  renderPatterns();
  reset();
});

els.themePick.addEventListener('click', (event) => {
  const button = event.target.closest('[data-theme]');
  if (button) applyTheme(button.dataset.theme);
});

els.langPick.addEventListener('click', (event) => {
  const button = event.target.closest('[data-lang]');
  if (button) { cfg.lang = button.dataset.lang; save(); applyLang(); }
});

/** Boja preglednikove trake prati odabranu temu, ne ostaje na zadanoj. */
function syncThemeColor() {
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  const meta = document.querySelector('meta[name="theme-color"]');
  if (bg && meta) meta.setAttribute('content', bg);
}

function applyTheme(id) {
  cfg.theme = ['svjetlo', 'tamno', 'zeleno'].includes(id) ? id : 'svjetlo';
  els.root.dataset.theme = cfg.theme;
  els.body.dataset.theme = cfg.theme;
  save();
  renderPicks();
  syncThemeColor();
}

function bindSwitch(el, key, after) {
  el.setAttribute('aria-checked', String(Boolean(cfg[key])));
  el.addEventListener('click', () => {
    cfg[key] = el.getAttribute('aria-checked') !== 'true';
    el.setAttribute('aria-checked', String(cfg[key]));
    save();
    if (after) after();
  });
}

bindSwitch(els.soundSw, 'sound');
bindSwitch(els.vibrateSw, 'vibrate');
bindSwitch(els.countSw, 'countdown', paint);
bindSwitch(els.awakeSw, 'keepAwake', () => { if (!cfg.keepAwake) releaseWakeLock(); else if (running) requestWakeLock(); });

els.testSound.addEventListener('click', () => { wakeAudio(); phaseSound(0, 2.5); window.setTimeout(() => phaseSound(2, 2.5), 2700); });

const openSheet = () => { els.sheet.classList.add('on'); els.sheet.setAttribute('aria-hidden', 'false'); };
const closeSheet = () => { els.sheet.classList.remove('on'); els.sheet.setAttribute('aria-hidden', 'true'); };

els.setupBtn.addEventListener('click', openSheet);
els.sheetClose.addEventListener('click', closeSheet);
els.sheet.addEventListener('click', (event) => { if (event.target === els.sheet) closeSheet(); });

document.addEventListener('keydown', (event) => {
  if (event.target.matches('input')) return;
  if (event.key === 'Escape') { closeSheet(); closeSession(); return; }
  if (event.code === 'Space') { event.preventDefault(); running ? pause() : start(); return; }
  if (event.key === 'r' || event.key === 'R') reset();
});

/* ═══════════════════════════════════════════════════════════
   8 · Start
   ═══════════════════════════════════════════════════════════ */

// Zupčanik iste geometrije kao u ostatku Workshopa.
els.gear.setAttribute('d', 'M9.6 4.7L10.5 2.1L13.5 2.1L14.4 4.7L15.5 5.1L17.9 4.0L20.0 6.1L18.9 8.5L19.3 9.6L21.9 10.5L21.9 13.5L19.3 14.4L18.9 15.5L20.0 17.9L17.9 20.0L15.5 18.9L14.4 19.3L13.5 21.9L10.5 21.9L9.6 19.3L8.5 18.9L6.1 20.0L4.0 17.9L5.1 15.5L4.7 14.4L2.1 13.5L2.1 10.5L4.7 9.6L5.1 8.5L4.0 6.1L6.1 4.0L8.5 5.1Z');

cfg.lang = LANGS[cfg.lang] ? cfg.lang : detectLang();
applyTheme(cfg.theme);
phaseStart = Date.now();
applyLang();

})();
</script>
