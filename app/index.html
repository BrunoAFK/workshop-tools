<!doctype html>
<html lang="hr" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Workshop — osobni registar alata. Pretraživ do zadnje rečenice.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title data-i18n="title">Workshop — registar alata</title>
<style>
/* ═══════════════════════════════════════════════════════════
   WORKSHOP · katalog alata

   Sadržaj nosi stranicu, ne ukras. Jedno pismo, jedna linija
   debljine 1px, jedan akcent. Ništa se ne miče bez razloga.
   ═══════════════════════════════════════════════════════════ */

:root {
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --ease: cubic-bezier(.2, .7, .3, 1);

  /* Sve stoji na višekratniku od 4px, pa se razmaci ne razilaze. */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;

  /* Jedinstvena visina kontrole — retci čine crtu, ne stepenice. */
  --ctl: 36px;
  --ctl-sm: 28px;

  --r: 8px;
  --r-sm: 5px;
  --shell: 1080px;
}

/* ── DAN (zadano) ──────────────────────────────────────────── */
html[data-theme="day"] {
  --bg:      #fbfaf7;
  --panel:   #ffffff;
  --panel-2: #f4f2ed;
  --fg:      #1b1a17;
  --fg-2:    #55534c;
  --fg-3:    #8a877d;
  --line:    #e3e0d8;
  --line-2:  #cdc9be;
  --accent:  #a9740c;
  --accent-bg: rgba(169, 116, 12, .09);
  --mark-bg: #fbe6a8;
  --mark-fg: #1b1a17;
  --add:     #1f6b47;
  --add-bg:  rgba(31, 107, 71, .08);
  --del:     #a3341f;
  --del-bg:  rgba(163, 52, 31, .08);
  --scrim:   rgba(27, 26, 23, .34);
  --shadow:  0 12px 34px rgba(27, 26, 23, .13);
  color-scheme: light;
}

/* ── NOĆ ───────────────────────────────────────────────────── */
html[data-theme="night"] {
  --bg:      #121211;
  --panel:   #1a1a18;
  --panel-2: #232320;
  --fg:      #eceae4;
  --fg-2:    #a8a59c;
  --fg-3:    #7b786f;
  --line:    #2c2c28;
  --line-2:  #3d3c37;
  --accent:  #d9a441;
  --accent-bg: rgba(217, 164, 65, .13);
  --mark-bg: #5a4712;
  --mark-fg: #f6efdc;
  --add:     #63b98d;
  --add-bg:  rgba(99, 185, 141, .12);
  --del:     #e08670;
  --del-bg:  rgba(224, 134, 112, .12);
  --scrim:   rgba(0, 0, 0, .58);
  --shadow:  0 12px 34px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

/* ═══════════════════════════════════════════════════════════
   Osnova
   ═══════════════════════════════════════════════════════════ */

* { box-sizing: border-box }

/* Elementi koji se skrivaju atributom `hidden` nose i vlastiti `display`
   (izbornik jezika, gumb verzija), a on bi ga inače nadjačao. */
[hidden] { display: none !important }

html { -webkit-text-size-adjust: 100% }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 15px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}

body.locked { overflow: hidden }

h1, h2, h3, p, dl, dd, ol, ul, figure { margin: 0 }
ol, ul { padding: 0; list-style: none }

a { color: inherit; text-decoration: none }

button, input, select, textarea { font: inherit; color: inherit }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

mark {
  padding: 0 1px;
  border-radius: 2px;
  background: var(--mark-bg);
  color: var(--mark-fg);
}

kbd {
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--panel);
  color: var(--fg-3);
  font: 500 11px/1.5 var(--mono);
}

.shell {
  max-width: var(--shell);
  margin: 0 auto;
  padding: 0 var(--sp-5);
}

/* ═══════════════════════════════════════════════════════════
   Zaglavlje
   ═══════════════════════════════════════════════════════════ */

.masthead {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
  height: 56px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
}

.mark {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  color: var(--fg);
}

.mark-badge {
  width: 20px;
  height: 20px;
  color: var(--accent);
  flex: none;
}

.mark-name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.01em;
}

.masthead-tools {
  display: flex;
  align-items: center;
  gap: var(--sp-1);
}

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: var(--ctl-sm);
  height: var(--ctl-sm);
  padding: 0;
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  background: none;
  color: var(--fg-2);
  cursor: pointer;
  transition: background .14s var(--ease), color .14s var(--ease);
}

.icon-btn svg { width: 15px; height: 15px }
.icon-btn:hover { background: var(--panel-2); color: var(--fg) }
.icon-btn[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent) }

.segmented {
  display: flex;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
}

.segmented .icon-btn {
  width: 24px;
  height: 22px;
  border-radius: 3px;
}

/* ── Jezik ── */

.lang-wrap { position: relative }

.lang-menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  min-width: 132px;
  padding: var(--sp-1);
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--panel);
  box-shadow: var(--shadow);
}

.lang-menu button {
  padding: 7px var(--sp-3);
  border: 0;
  border-radius: var(--r-sm);
  background: none;
  color: var(--fg-2);
  font-size: 13px;
  text-align: left;
  cursor: pointer;
}

.lang-menu button:hover { background: var(--panel-2); color: var(--fg) }
.lang-menu button[aria-pressed="true"] { color: var(--accent); font-weight: 600 }

/* ═══════════════════════════════════════════════════════════
   Pretraga i filtri
   ═══════════════════════════════════════════════════════════ */

main { padding: var(--sp-6) 0 var(--sp-7) }

.console { display: grid; gap: var(--sp-3) }

.console-bar {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  height: 44px;
  padding: 0 var(--sp-4);
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--panel);
  transition: border-color .14s var(--ease);
}

.console-bar:focus-within { border-color: var(--line-2) }
.console-bar > svg { width: 17px; height: 17px; color: var(--fg-3); flex: none }

.console-bar input {
  flex: 1;
  min-width: 0;
  height: 100%;
  border: 0;
  background: none;
  font-size: 15px;
  outline: none;
}

.console-bar input::placeholder { color: var(--fg-3) }
.console-bar input::-webkit-search-cancel-button { display: none }
.console-bar kbd { flex: none }

.clear-btn {
  display: none;
  place-items: center;
  width: 22px;
  height: 22px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--panel-2);
  color: var(--fg-2);
  font-size: 11px;
  cursor: pointer;
  flex: none;
}

.clear-btn.on { display: grid }
.clear-btn:hover { color: var(--fg) }

.console-rail {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
  flex-wrap: wrap;
}

.filters {
  display: flex;
  align-items: center;
  gap: var(--sp-1);
  flex-wrap: wrap;
}

.rail-right {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-left: auto;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: var(--ctl-sm);
  padding: 0 10px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: none;
  color: var(--fg-2);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .14s var(--ease), color .14s var(--ease);
}

.chip:hover { background: var(--panel-2); color: var(--fg) }

.chip i {
  color: var(--fg-3);
  font: 500 11px/1 var(--mono);
  font-style: normal;
}

.chip[aria-pressed="true"] {
  background: var(--accent-bg);
  color: var(--accent);
  font-weight: 500;
}

.chip[aria-pressed="true"] i { color: inherit; opacity: .75 }

#archiveBtn { border-color: var(--line) }

.select-wrap { position: relative; display: flex }

.select-wrap::after {
  content: "";
  position: absolute;
  top: 50%;
  right: 10px;
  width: 6px;
  height: 6px;
  margin-top: -4px;
  border-right: 1.4px solid var(--fg-3);
  border-bottom: 1.4px solid var(--fg-3);
  transform: rotate(45deg);
  pointer-events: none;
}

.select-wrap select {
  height: var(--ctl-sm);
  padding: 0 26px 0 10px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: none;
  color: var(--fg-2);
  font-size: 13px;
  cursor: pointer;
  appearance: none;
}

.select-wrap select:hover { color: var(--fg) }

/* ═══════════════════════════════════════════════════════════
   Brojač rezultata
   ═══════════════════════════════════════════════════════════ */

.tally {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex-wrap: wrap;
  margin: var(--sp-5) 0 var(--sp-4);
  padding-bottom: var(--sp-3);
  border-bottom: 1px solid var(--line);
  color: var(--fg-3);
  font-size: 13px;
}

.tally b { color: var(--fg-2); font-weight: 600 }

.tally-hint {
  padding: 2px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: none;
  color: var(--fg-2);
  font-size: 12px;
  cursor: pointer;
}

.tally-hint:hover { border-color: var(--line-2); color: var(--fg) }

/* ═══════════════════════════════════════════════════════════
   Rezultati — kartice
   ═══════════════════════════════════════════════════════════ */

.results[data-view="chart"] {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(288px, 1fr));
  gap: var(--sp-4);
}

.results[data-view="chart"] .card {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  padding: var(--sp-4);
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--panel);
  cursor: pointer;
  transition: border-color .14s var(--ease);
}

.results[data-view="chart"] .card:hover { border-color: var(--line-2) }

.card-cover {
  margin: calc(var(--sp-4) * -1) calc(var(--sp-4) * -1) 0;
  border-bottom: 1px solid var(--line);
  border-radius: var(--r) var(--r) 0 0;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  background: var(--panel-2);
}

.card-cover img { width: 100%; height: 100%; object-fit: cover; display: block }

.card-tags {
  display: flex;
  gap: var(--sp-2);
  flex-wrap: wrap;
  color: var(--fg-3);
  font: 500 11px/1 var(--mono);
  letter-spacing: .04em;
  text-transform: uppercase;
}

.card h2 { font-size: 16px; font-weight: 600; line-height: 1.35; letter-spacing: -.01em }
.card h2 a:hover { color: var(--accent) }

/* `flex: 1` daje tijelu svu preostalu visinu retka — bez `align-content`
   grid bi tu visinu razmazao među recima, pa bi kartica bez slike imala
   rupe između tagova, naslova i opisa. */
.card-body { display: grid; align-content: start; gap: var(--sp-2); flex: 1 }

.card-body p {
  color: var(--fg-2);
  font-size: 13.5px;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.snippet {
  padding-left: var(--sp-3);
  border-left: 2px solid var(--line);
  color: var(--fg-3) !important;
  font-size: 12.5px !important;
  -webkit-line-clamp: 2 !important;
}

.card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  padding-top: var(--sp-3);
  border-top: 1px solid var(--line);
  color: var(--fg-3);
  font: 400 11.5px/1 var(--mono);
}

.card-foot > span:last-child { display: flex; gap: var(--sp-1) }
.sep { margin: 0 6px; font-style: normal; opacity: .5 }

.mini {
  display: inline-grid;
  place-items: center;
  width: 24px;
  height: 24px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  background: none;
  color: var(--fg-3);
  cursor: pointer;
  transition: background .14s var(--ease), color .14s var(--ease);
}

.mini svg { width: 13px; height: 13px }
.mini:hover { background: var(--panel-2); color: var(--fg) }
.mini.ok { color: var(--add) }

/* ═══════════════════════════════════════════════════════════
   Rezultati — popis
   ═══════════════════════════════════════════════════════════ */

.results[data-view="register"] {
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--panel);
  overflow: hidden;
}

.results[data-view="register"] .card {
  display: grid;
  grid-template-columns: minmax(150px, 1.1fr) minmax(0, 1.9fr) minmax(0, .7fr) 74px 76px 32px;
  align-items: center;
  gap: var(--sp-4);
  min-height: 42px;
  padding: var(--sp-2) var(--sp-4);
  border-top: 1px solid var(--line);
  cursor: pointer;
}

.results[data-view="register"] .card:first-child { border-top: 0 }
.results[data-view="register"] .card:hover { background: var(--panel-2) }

.r-title {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.r-title a:hover { color: var(--accent) }

.r-desc, .r-tags, .r-meta {
  color: var(--fg-3);
  font-size: 12.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.r-meta { font-family: var(--mono); font-size: 11.5px; text-align: right }
.r-act { display: flex; justify-content: flex-end }

/* ═══════════════════════════════════════════════════════════
   Prazno stanje
   ═══════════════════════════════════════════════════════════ */

.notice {
  grid-column: 1 / -1;
  display: grid;
  justify-items: center;
  gap: var(--sp-3);
  padding: var(--sp-7) var(--sp-4);
  text-align: center;
}

.notice svg { width: 30px; height: 30px; color: var(--fg-3) }
.notice h2 { font-size: 15px; font-weight: 600 }
.notice p { max-width: 42ch; color: var(--fg-3); font-size: 13.5px }

.notice code {
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--panel-2);
  font: 400 12px/1.5 var(--mono);
}

/* ═══════════════════════════════════════════════════════════
   Podnožje
   ═══════════════════════════════════════════════════════════ */

.foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
  flex-wrap: wrap;
  margin-top: var(--sp-7);
  padding: var(--sp-4) 0 var(--sp-6);
  border-top: 1px solid var(--line);
  color: var(--fg-3);
  font-size: 12px;
}

.foot-keys { display: flex; align-items: center; gap: 5px }
#stamp { font-family: var(--mono); font-size: 11.5px }

/* ═══════════════════════════════════════════════════════════
   Ladica s pregledom
   ═══════════════════════════════════════════════════════════ */

.drawer {
  position: fixed;
  inset: 0;
  z-index: 90;
  visibility: hidden;
  opacity: 0;
  transition: opacity .2s var(--ease), visibility .2s var(--ease);
}

.drawer.on { visibility: visible; opacity: 1 }

.drawer-scrim {
  position: absolute;
  inset: 0;
  width: 100%;
  padding: 0;
  border: 0;
  background: var(--scrim);
  cursor: pointer;
}

.drawer-panel {
  position: absolute;
  inset: 0 0 0 auto;
  display: flex;
  flex-direction: column;
  width: min(780px, 100%);
  border-left: 1px solid var(--line);
  background: var(--bg);
  transform: translateX(14px);
  transition: transform .24s var(--ease);
}

.drawer.on .drawer-panel { transform: none }

.drawer-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-4);
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid var(--line);
}

.drawer-ident { min-width: 0 }
.drawer-ident h3 { font-size: 16px; font-weight: 600; letter-spacing: -.01em }

.drawer-meta {
  margin-top: 3px;
  color: var(--fg-3);
  font: 400 11.5px/1.5 var(--mono);
}

.drawer-acts { display: flex; align-items: center; gap: var(--sp-1); flex: none }

.act {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: var(--ctl-sm);
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: none;
  color: var(--fg-2);
  font-size: 12.5px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .14s var(--ease), color .14s var(--ease), border-color .14s var(--ease);
}

.act svg { width: 12px; height: 12px }
.act:hover { border-color: var(--line-2); color: var(--fg) }
.act[aria-pressed="true"] { background: var(--accent-bg); border-color: transparent; color: var(--accent) }

.act.primary {
  border-color: var(--fg);
  background: var(--fg);
  color: var(--bg);
}

.act.primary:hover { opacity: .85; color: var(--bg) }

.drawer-frame { position: relative; flex: 1; background: var(--panel) }

.drawer-loading {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--fg-3);
  font-size: 13px;
}

.drawer-frame.ready .drawer-loading { display: none }

#drawerIframe {
  width: 100%;
  height: 100%;
  border: 0;
  opacity: 0;
  transition: opacity .2s var(--ease);
}

.drawer-frame.ready #drawerIframe { opacity: 1 }

/* ── Vremenska crta ── */

.timeline { flex: 1; overflow: auto; padding: var(--sp-5) }

.tl-item {
  padding: var(--sp-3) 0;
  border-bottom: 1px solid var(--line);
}

.tl-when {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  color: var(--fg-3);
  font: 400 11.5px/1.5 var(--mono);
}

.tl-badge {
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--accent-bg);
  color: var(--accent);
  font-size: 10px;
  letter-spacing: .05em;
  text-transform: uppercase;
}

.tl-title { margin-top: 3px; font-size: 14px; font-weight: 500 }
.tl-item.current .tl-title { color: var(--fg) }
.tl-acts { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-2) }

/* ── Razlike ── */

.diff {
  margin-top: var(--sp-4);
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--panel);
  overflow: hidden;
}

.diff-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--line);
  color: var(--fg-2);
  font: 400 12px/1.5 var(--mono);
}

.diff-body { max-height: 46vh; overflow: auto; padding: var(--sp-2) 0 }

.diff-row {
  display: grid;
  grid-template-columns: 20px 1fr;
  gap: var(--sp-2);
  padding: 3px var(--sp-4);
  font-size: 13px;
  line-height: 1.5;
}

.diff-row > span:first-child { color: var(--fg-3); font-family: var(--mono); text-align: center }
.diff-row.same { color: var(--fg-3) }
.diff-row.add { background: var(--add-bg) }
.diff-row.add > span:first-child { color: var(--add) }
.diff-row.del { background: var(--del-bg) }
.diff-row.del > span:first-child { color: var(--del) }

.diff-note, .diff-skip {
  padding: var(--sp-3) var(--sp-4);
  color: var(--fg-3);

/* ═══════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════ */

.palette {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: start center;
  padding: 12vh var(--sp-4) var(--sp-4);
  background: var(--scrim);
  visibility: hidden;
  opacity: 0;
  transition: opacity .16s var(--ease), visibility .16s var(--ease);
}

.palette.on { visibility: visible; opacity: 1 }

.palette-box {
  width: min(560px, 100%);
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--panel);
  box-shadow: var(--shadow);
  overflow: hidden;
  transform: translateY(-6px);
  transition: transform .16s var(--ease);
}

.palette.on .palette-box { transform: none }

.palette-input {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 0 var(--sp-4);
  height: 46px;
  border-bottom: 1px solid var(--line);
}

.palette-input svg { width: 16px; height: 16px; color: var(--fg-3); flex: none }

.palette-input input {
  flex: 1;
  height: 100%;
  border: 0;
  background: none;
  font-size: 15px;
  outline: none;
}

.palette-list { max-height: 46vh; overflow: auto; padding: var(--sp-1) }

.p-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  padding: 8px var(--sp-3);
  border: 0;
  border-radius: var(--r-sm);
  background: none;
  text-align: left;
  cursor: pointer;
}

.p-item[aria-selected="true"] { background: var(--panel-2) }
.p-name { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.p-tags { color: var(--fg-3); font-size: 11.5px; white-space: nowrap }
.palette-empty { padding: var(--sp-5); color: var(--fg-3); font-size: 13px; text-align: center }

.palette-foot {
  display: flex;
  gap: var(--sp-4);
  flex-wrap: wrap;
  padding: var(--sp-2) var(--sp-4);
  border-top: 1px solid var(--line);
  color: var(--fg-3);
  font: 400 11px/1.6 var(--mono);
}

/* ═══════════════════════════════════════════════════════════
   Obavijest
   ═══════════════════════════════════════════════════════════ */

.toast {
  position: fixed;
  left: 50%;
  bottom: var(--sp-5);
  z-index: 110;
  padding: 9px var(--sp-4);
  border-radius: 999px;
  background: var(--fg);
  color: var(--bg);
  font-size: 13px;
  transform: translate(-50%, 12px);
  opacity: 0;
  visibility: hidden;
  transition: opacity .18s var(--ease), transform .18s var(--ease), visibility .18s var(--ease);
}

.toast.on { opacity: 1; visibility: visible; transform: translate(-50%, 0) }

/* ═══════════════════════════════════════════════════════════
   Uski ekrani
   ═══════════════════════════════════════════════════════════ */

@media (max-width: 720px) {

@media (prefers-reduced-motion: reduce) {

let activeDoc = null;

const state = {
  q: '',
  tag: null,
  sort: 'relevance',
  view: localStorage.getItem('workshop.view') || 'chart',
  archive: false
};

/* ═══════════════════════════════════════════════════════════
   2 · TEXT UTILITIES
   ═══════════════════════════════════════════════════════════ */

/** NFD-fold + lowercase. Length-stable for Croatian, so offsets map 1:1. */
const fold = (v) => String(v || '')
  .normalize('NFD').replace(/[̀-ͯ]/g, '').toLocaleLowerCase('hr');

const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Brojevi i datumi prate odabrani jezik, inače bi engleski katalog
   pokazivao hrvatske datume. Rekonstruiraju se u `setLang`. */
const LOCALES = { hr: 'hr-HR', en: 'en-GB', de: 'de-DE' };
let nf, dfShort, dfLong, collator;

function buildFormatters() {
  const locale = LOCALES[lang] || 'en-GB';
  nf = new Intl.NumberFormat(locale);
  dfShort = new Intl.DateTimeFormat(locale, { day: '2-digit', month: '2-digit', year: '2-digit' });
  dfLong = new Intl.DateTimeFormat(locale, { dateStyle: 'long' });
  collator = new Intl.Collator(locale);
}
buildFormatters();

const terms = (q) => fold(q).split(/\s+/).filter((t) => t.length > 0);

/* ═══════════════════════════════════════════════════════════
   4 · SCORING + SNIPPETS
   ═══════════════════════════════════════════════════════════ */

function prepare(raw) {
  return raw.map((item) => {
    const content = item.content || '';
    const words = content ? content.split(/\s+/).filter(Boolean).length : 0;
    return {
      ...item,
      content,
      words,
      when: new Date(item.modifiedAt),
      day: String(item.modifiedAt).slice(0, 10),
      fTitle: fold(item.title),
      fDesc: fold(item.description),
      fTags: fold((item.tags || []).join(' ')),
      fContent: fold(content)
    };
  });
}

/** AND semantics across terms; weighted by where each term lands. */
function score(doc, ts) {
  if (!ts.length) return 0;
  let total = 0;
  for (const t of ts) {
    let s = 0;
    const ti = doc.fTitle.indexOf(t);
    if (ti === 0) s += 160;
    else if (ti > 0) s += 110;
    if (doc.fTags.includes(t)) s += 55;
    if (doc.fDesc.includes(t)) s += 32;
    let hits = 0, at = doc.fContent.indexOf(t);
    while (at !== -1 && hits < 40) { hits++; at = doc.fContent.indexOf(t, at + t.length); }
    if (hits) s += 8 + Math.min(hits, 25) * 2.5;
    if (!s) return -1;              // one term missing → not a match
    total += s;
  }
  return total;
}

/** Context snippet around the earliest hit, with every term marked. */
function snippet(doc, ts) {
  if (!ts.length) return '';
  let at = -1;
  for (const t of ts) {
    const i = doc.fContent.indexOf(t);
    if (i !== -1 && (at === -1 || i < at)) at = i;
  }
  if (at === -1) return '';

  const raw = doc.content;
  let from = Math.max(0, at - 90);
  let to = Math.min(raw.length, at + 190);
  if (from > 0) { const sp = raw.indexOf(' ', from); if (sp !== -1 && sp < at) from = sp + 1; }
  if (to < raw.length) { const sp = raw.lastIndexOf(' ', to); if (sp > at) to = sp; }

  // collect + merge match ranges inside the window
  const ranges = [];
  for (const t of ts) {
    let i = doc.fContent.indexOf(t, from);
    while (i !== -1 && i < to) { ranges.push([i, Math.min(i + t.length, to)]); i = doc.fContent.indexOf(t, i + t.length); }
  }
  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const r of ranges) {
    const last = merged[merged.length - 1];
    if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
    else merged.push([...r]);
  }

  let html = '', pos = from;
  for (const [a, b] of merged) {
    html += esc(raw.slice(pos, a)) + '<mark>' + esc(raw.slice(a, b)) + '</mark>';
    pos = b;
  }
  html += esc(raw.slice(pos, to));
  return (from > 0 ? '…' : '') + html + (to < raw.length ? '…' : '');
}

/* ═══════════════════════════════════════════════════════════
   5 · FILTER + SORT
   ═══════════════════════════════════════════════════════════ */

function compute() {
  const ts = terms(state.q);
  let list = [];
  let hiddenArchive = 0;

  for (const doc of docs) {
    if (state.tag && !(doc.tags || []).includes(state.tag)) continue;
    const s = score(doc, ts);
    if (s < 0) continue;
    if (doc.isArchive && !state.archive) { hiddenArchive++; continue; }
    list.push({ doc, s });
  }

  // Uspoređuje se dan, ne trenutak: datum upisan u dokument nema sate
  // (stoji na podne UTC), pa bi inače izgubio od svake datoteke dirnute
  // isti dan poslijepodne. Unutar dana prednost ima eksplicitniji izvor.
  const SOURCE_RANK = { meta: 0, git: 1, mtime: 2 };
  const newestFirst = (a, b) => {
    if (a.day !== b.day) return b.day.localeCompare(a.day);
    const rank = (SOURCE_RANK[a.dateSource] ?? 3) - (SOURCE_RANK[b.dateSource] ?? 3);
    return rank || (b.when - a.when) || collator.compare(a.title, b.title);
  };

  const by = {
    relevance: (a, b) => (b.s - a.s) || newestFirst(a.doc, b.doc),
    recent:    (a, b) => newestFirst(a.doc, b.doc),
    oldest:    (a, b) => newestFirst(b.doc, a.doc),
    title:     (a, b) => collator.compare(a.doc.title, b.doc.title),
    size:      (a, b) => b.doc.words - a.doc.words
  };
  const mode = (state.sort === 'relevance' && !ts.length) ? 'recent' : state.sort;
  list.sort(by[mode] || by.recent);

  return { list: list.map((x) => x.doc), ts, hiddenArchive };
}

/* ═══════════════════════════════════════════════════════════
   6 · RENDER
   ═══════════════════════════════════════════════════════════ */

const ICON_COPY = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="4.6" y="4.6" width="8.2" height="8.2"/><path d="M9.4 4.6V1.2H1.2v8.2h3.4"/></svg>';
const ICON_OUT = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 10 10 4M5 4h5v5"/></svg>';
const ICON_TIME = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="7" cy="7" r="5.4"/><path d="M7 3.9V7l2.1 1.5"/></svg>';

/**
 * Gumb vremenske crte — samo kad dokument uistinu ima stariju verziju.
 * Bez njega je crta dostupna jedino iz brze palete, pa je praktički nema.
 */
function versionsButton(doc) {
  const n = (doc.versions || []).length;
  return n > 1
    ? `<button class="mini" type="button" data-versions="${esc(doc.id)}" aria-label="${t('versions')}" title="${t('versions')} (${n})">${ICON_TIME}</button>`
    : '';
}

/**
 * Kartica nosi samo ono što pomaže odabrati alat: kategorije, naslov,
 * opis i — kad se pretražuje — isječak s pogotkom. Slika se pokazuje
 * ako je dokument nosi; nema zamjenskog ukrasa kad je nema.
 */
function chartCard(doc, ts) {
  const snip = snippet(doc, ts);
  const tags = (doc.tags || []).slice(0, 3);
  if (doc.isArchive) tags.unshift(t('archive'));
  return `<article class="card" data-id="${esc(doc.id)}">
    ${doc.image ? `<div class="card-cover"><img src="${esc(doc.image)}" alt="" loading="lazy" decoding="async"></div>` : ''}
    <div class="card-body">
      <div class="card-tags">${tags.map((tag) => `<span>${esc(tag)}</span>`).join('')}</div>
      <h2><a class="card-link" href="${esc(doc.url)}" target="_blank" rel="noopener" title="${esc(doc.title)}">${esc(doc.title)}</a></h2>
      <p>${esc(doc.description)}</p>
      ${snip ? `<p class="snippet">${snip}</p>` : ''}
    </div>
    <div class="card-foot">
      <span>${dfShort.format(doc.when)}<i class="sep">·</i>${nf.format(doc.words)} ${t('words')}</span>
      <span>
        ${versionsButton(doc)}
        <button class="mini" type="button" data-copy="${esc(doc.url)}" aria-label="${t('copyLink')}" title="${t('copy')}">${ICON_COPY}</button>
        <a class="mini" href="${esc(doc.url)}" target="_blank" rel="noopener" aria-label="${t('openTabAria')}" title="${t('openTab')}">${ICON_OUT}</a>
      </span>
    </div>
  </article>`;
}

function registerRow(doc) {
  return `<article class="card" data-id="${esc(doc.id)}">
    <span class="r-title"><a class="card-link" href="${esc(doc.url)}" target="_blank" rel="noopener">${esc(doc.title)}</a></span>
    <span class="r-desc">${esc(doc.description)}</span>
    <span class="r-tags">${esc((doc.isArchive ? [t('archive')] : (doc.tags || []).slice(0, 2)).join(' · '))}</span>
    <span class="r-meta">${nf.format(doc.words)} ${t('words')}</span>
    <span class="r-meta">${dfShort.format(doc.when)}</span>
    <span class="r-act">
      ${versionsButton(doc)}
      <button class="mini" type="button" data-copy="${esc(doc.url)}" aria-label="${t('copyLink')}" title="${t('copy')}">${ICON_COPY}</button>
    </span>
  </article>`;
}

function renderFilters() {
  const counts = new Map();
  for (const doc of docs) {
    if (doc.isArchive && !state.archive) continue;
    for (const t of doc.tags || []) counts.set(t, (counts.get(t) || 0) + 1);
  }
  const top = [...counts.entries()]
    .sort((a, b) => b[1] - a[1] || collator.compare(a[0], b[0]))
    .slice(0, 10);

  els.filters.innerHTML = [['', docs.filter((d) => state.archive || !d.isArchive).length], ...top]
    .map(([tag, n]) => {
      const on = (!tag && !state.tag) || tag === state.tag;
      // Prazan tag je „sve" — naziv mu dolazi iz rječnika, kategorije ne.
      return `<button class="chip" type="button" data-tag="${esc(tag)}" aria-pressed="${on}">${esc(tag || t('all'))} <i>${n}</i></button>`;
    }).join('');
}

function render() {
  if (!index) return;
  const { list, ts, hiddenArchive } = compute();
  visible = list;
  cursor = -1;

  els.results.dataset.view = state.view;
  els.results.innerHTML = list.length
    ? list.map((doc) => state.view === 'chart' ? chartCard(doc, ts) : registerRow(doc)).join('')
    : `<div class="notice">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="17" cy="17" r="12"/><path d="m26 26 11 11"/><path d="M12 17h10" opacity=".5"/></svg>
        <h2>${t('noHitsHint')}</h2>
        <p>${t('noHitsTip')}${state.archive ? '' : t('noHitsArchive')}</p>
      </div>`;

  const bits = [`<b>${list.length}</b> ${t(list.length === 1 ? 'tools1' : 'toolsN')}`];
  if (ts.length) bits.push(`${t('matching')} <b>${esc(state.q.trim())}</b>`);
  if (state.tag) bits.push(`${t('inCategory')} <b>${esc(state.tag)}</b>`);
  bits.push(`· ${els.sort.selectedOptions[0].text}`);
  els.tally.innerHTML = bits.join(' ') +
    (hiddenArchive ? ` <button class="tally-hint" type="button" id="showArchive">+${hiddenArchive} ${t('inArchive')}</button>` : '');

  const hint = $('#showArchive');
  if (hint) hint.addEventListener('click', () => { state.archive = true; syncArchive(); renderFilters(); render(); });

  els.clear.classList.toggle('on', Boolean(state.q));
  syncUrl();
}

/** Traka pretrage stoji na vrhu na svakoj širini — `/` samo skače na nju. */
function focusSearch() {
  els.search.focus();
  els.search.select();
}

function syncArchive() {
  els.archiveBtn.setAttribute('aria-pressed', String(state.archive));
  els.archiveCount.textContent = docs.filter((d) => d.isArchive).length || '';
}

/* ═══════════════════════════════════════════════════════════
   7 · URL STATE
   ═══════════════════════════════════════════════════════════ */

let urlTimer;
function syncUrl() {
  clearTimeout(urlTimer);
  urlTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (state.q.trim()) p.set('q', state.q.trim());
    if (state.tag) p.set('tag', state.tag);
    if (state.sort !== 'relevance') p.set('sort', state.sort);
    if (state.archive) p.set('arh', '1');
    const hash = p.toString();
    history.replaceState(null, '', hash ? `#${hash}` : location.pathname + location.search);
  }, 260);
}

function readUrl() {
  const p = new URLSearchParams(location.hash.slice(1));
  state.q = p.get('q') || '';
  state.tag = p.get('tag') || null;
  state.sort = p.get('sort') || 'relevance';
  state.archive = p.get('arh') === '1';
  els.search.value = state.q;
  els.sort.value = state.sort;
}

/* ═══════════════════════════════════════════════════════════
   8 · DRAWER
   ═══════════════════════════════════════════════════════════ */

function openDrawer(id, onTimeline = false) {
  const doc = docs.find((d) => d.id === id);
  if (!doc) return;
  lastFocus = document.activeElement;
  activeDoc = doc;
  els.drawerTitle.textContent = doc.title;
  els.drawerMeta.textContent = `${(doc.tags || []).join(' · ')} · ${nf.format(doc.words)} ${t('words')} · ${dfLong.format(doc.when)}`;
  els.drawerOpen.href = doc.url;
  els.drawerCopy.dataset.copy = doc.url;
  els.drawerFrame.classList.remove('ready');
  els.drawerIframe.src = doc.url;

  const versions = doc.versions || [];
  els.drawerVersions.hidden = versions.length < 2;
  els.drawerVersionCount.textContent = versions.length;
  if (versions.length > 1) renderTimeline(doc);
  showTimeline(onTimeline && versions.length > 1);
  els.drawer.classList.add('on');
  els.drawer.setAttribute('aria-hidden', 'false');
  els.drawerScrim.tabIndex = 0;
  document.body.classList.add('locked');
  requestAnimationFrame(() => els.drawerClose.focus());
}

function closeDrawer() {
  if (!els.drawer.classList.contains('on')) return;
  els.drawer.classList.remove('on');
  els.drawer.setAttribute('aria-hidden', 'true');
  els.drawerScrim.tabIndex = -1;
  document.body.classList.remove('locked');
  setTimeout(() => { els.drawerIframe.src = 'about:blank'; }, 460);
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
}

els.drawerIframe.addEventListener('load', () => els.drawerFrame.classList.add('ready'));
els.drawerClose.addEventListener('click', closeDrawer);
els.drawerScrim.addEventListener('click', closeDrawer);

els.drawerVersions.addEventListener('click', () => showTimeline(els.timeline.hidden));
els.diffClose.addEventListener('click', () => { els.diff.hidden = true; });

els.timelineList.addEventListener('click', (event) => {
  const show = event.target.closest('[data-show]');
  if (show && activeDoc) {
    const version = activeDoc.versions[Number(show.dataset.show)];
    els.drawerFrame.classList.remove('ready');
    els.drawerIframe.src = version.url;
    showTimeline(false);
    return;
  }
  const diff = event.target.closest('[data-diff]');
  if (diff && activeDoc) showDiff(activeDoc, Number(diff.dataset.diff));
});

/* ═══════════════════════════════════════════════════════════
   8b · VERSION TIMELINE + DIFF
   ═══════════════════════════════════════════════════════════ */

const BLOCK_SELECTOR = 'p,li,h1,h2,h3,h4,h5,h6,td,th,dt,dd,blockquote,figcaption,summary,caption,button,label';
const versionTextCache = new Map();

/** Isti izbor string literala kao u buildu — sadržaj je često u JS-u. */
function scriptProse(html) {
  const found = new Set();
  for (const block of html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)) {
    if (/\bsrc\s*=/i.test(block[1])) continue;
    const source = block[2].replace(/data:[a-z0-9/.+-]+;base64,[A-Za-z0-9+/=\s]*/gi, ' ');
    for (const literal of source.matchAll(/"((?:[^"\\\n]|\\.)*)"(\s*:)?|'((?:[^'\\\n]|\\.)*)'(\s*:)?/g)) {
      if (literal[2] || literal[4]) continue;
      const value = (literal[1] ?? literal[3] ?? '').replace(/\\[nrt]/g, ' ').trim();
      if (value.length < 12 || !/\s/.test(value)) continue;
      const letters = (value.match(/\p{L}/gu) || []).length;
      if (letters / value.length > 0.45) found.add(value);
    }
  }
  return [...found];
}

/**
 * Dokument → odlomci za usporedbu.
 *
 * Diff se radi nad čitljivim tekstom, ne nad HTML-om: promjena razmaka
 * ili redoslijeda atributa inače bi zatrpala stvarne izmjene sadržaja.
 */
function textBlocks(html) {
  const parsed = new DOMParser().parseFromString(html, 'text/html');
  for (const node of parsed.querySelectorAll('script,style,svg,canvas,noscript,template')) node.remove();

  const blocks = [];
  const seen = new WeakSet();
  for (const element of parsed.querySelectorAll(BLOCK_SELECTOR)) {
    if (element.querySelector(BLOCK_SELECTOR)) continue;   // samo najdublji
    seen.add(element);
    const text = (element.textContent || '').replace(/\s+/g, ' ').trim();
    if (text) blocks.push(text);
  }
  if (!blocks.length) {
    const all = (parsed.body?.textContent || '').replace(/\s+/g, ' ').trim();
    if (all) blocks.push(...all.split(/(?<=[.!?])\s+/).filter(Boolean));
  }
  return [...blocks, ...scriptProse(html)];
}

async function versionText(version) {
  if (versionTextCache.has(version.slug)) return versionTextCache.get(version.slug);
  const response = await fetch(version.url);
  if (!response.ok) throw new Error(`Verzija nije dostupna (${response.status}).`);
  const blocks = textBlocks(await response.text());
  versionTextCache.set(version.slug, blocks);
  return blocks;
}

const MAX_DIFF_CELLS = 4_000_000;

/** LCS nad odlomcima, uz odsijecanje zajedničkog početka i kraja. */
function diffBlocks(older, newer) {
  let start = 0;
  while (start < older.length && start < newer.length && older[start] === newer[start]) start++;
  let endOld = older.length;
  let endNew = newer.length;
  while (endOld > start && endNew > start && older[endOld - 1] === newer[endNew - 1]) { endOld--; endNew--; }

  const head = older.slice(0, start).map((value) => ({ mark: '=', value }));
  const tail = older.slice(endOld).map((value) => ({ mark: '=', value }));
  const a = older.slice(start, endOld);
  const b = newer.slice(start, endNew);

  if (!a.length && !b.length) return [...head, ...tail];
  if ((a.length + 1) * (b.length + 1) > MAX_DIFF_CELLS) return null;

  const width = b.length + 1;
  const table = new Uint32Array((a.length + 1) * width);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = b.length - 1; j >= 0; j--) {
      table[i * width + j] = a[i] === b[j]
        ? table[(i + 1) * width + j + 1] + 1
        : Math.max(table[(i + 1) * width + j], table[i * width + j + 1]);
    }
  }

  const middle = [];
  let i = 0;
  let j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { middle.push({ mark: '=', value: a[i] }); i++; j++; }
    else if (table[(i + 1) * width + j] >= table[i * width + j + 1]) { middle.push({ mark: '-', value: a[i] }); i++; }
    else { middle.push({ mark: '+', value: b[j] }); j++; }
  }
  while (i < a.length) middle.push({ mark: '-', value: a[i++] });
  while (j < b.length) middle.push({ mark: '+', value: b[j++] });

  return [...head, ...middle, ...tail];
}

const CONTEXT = 2;

function renderDiff(rows) {
  if (!rows) return `<p class="diff-note">${t('diffBig')}</p>`;
  if (!rows.some((row) => row.mark !== '=')) return `<p class="diff-note">${t('diffNone')}</p>`;

  // prikazuje se samo okolina promjena — sve ostalo se sažima
  const keep = new Set();
  rows.forEach((row, index) => {
    if (row.mark === '=') return;
    for (let k = Math.max(0, index - CONTEXT); k <= Math.min(rows.length - 1, index + CONTEXT); k++) keep.add(k);
  });

  const out = [];
  let skipped = 0;
  rows.forEach((row, index) => {
    if (!keep.has(index)) { skipped++; return; }
    if (skipped) { out.push(`<p class="diff-skip">… ${skipped} ${t('unchanged')} …</p>`); skipped = 0; }
    const kind = row.mark === '+' ? 'add' : row.mark === '-' ? 'del' : 'same';
    const sign = row.mark === '=' ? '' : row.mark;
    out.push(`<div class="diff-row ${kind}"><span>${sign}</span><span>${esc(row.value)}</span></div>`);
  });
  if (skipped) out.push(`<p class="diff-skip">… ${skipped} ${t('unchanged')} …</p>`);
  return out.join('');
}

function showTimeline(show) {
  els.timeline.hidden = !show;
  els.drawerFrame.hidden = show;
  els.drawerVersions.setAttribute('aria-pressed', String(show));
  if (!show) els.diff.hidden = true;
}

function renderTimeline(doc) {
  els.timelineList.innerHTML = doc.versions.map((version, index) => {
    const when = version.current
      ? `${t('current')} · ${dfLong.format(new Date(version.modifiedAt))}`
      : `${t('archivedOn')} ${dfLong.format(new Date(version.archivedAt || version.modifiedAt))}`;
    const older = doc.versions[index + 1];
    return `<li class="tl-item${version.current ? ' current' : ''}">
      <div class="tl-when">${esc(when)}${version.current ? `<span class="tl-badge">${t('live')}</span>` : ''}</div>
      <p class="tl-title">${esc(version.title)}</p>
      <div class="tl-acts">
        <button class="act" type="button" data-show="${index}">${t('show')}</button>
        ${older ? `<button class="act" type="button" data-diff="${index}">${t('diffPrev')}</button>` : ''}
        <a class="act" href="${esc(version.url)}" target="_blank" rel="noopener">${t('openTab')}</a>
      </div>
    </li>`;
  }).join('');
}

async function showDiff(doc, newerIndex) {
  const newer = doc.versions[newerIndex];
  const older = doc.versions[newerIndex + 1];
  if (!older) return;

  els.diff.hidden = false;
  els.diffTitle.textContent = t('loadingBoth');
  els.diffBody.innerHTML = `<p class="diff-note">${t('comparing')}</p>`;

  try {
    const [olderBlocks, newerBlocks] = await Promise.all([versionText(older), versionText(newer)]);
    const rows = diffBlocks(olderBlocks, newerBlocks);
    const added = rows?.filter((row) => row.mark === '+').length || 0;
    const removed = rows?.filter((row) => row.mark === '-').length || 0;
    const olderWhen = dfShort.format(new Date(older.archivedAt || older.modifiedAt));
    const newerWhen = newer.current ? t('current') : dfShort.format(new Date(newer.archivedAt || newer.modifiedAt));
    els.diffTitle.textContent = `${olderWhen} → ${newerWhen} · +${added} / −${removed}`;
    els.diffBody.innerHTML = renderDiff(rows);
  } catch (error) {
    els.diffTitle.textContent = t('error');
    els.diffBody.innerHTML = `<p class="diff-note">${esc(error.message)}</p>`;
  }
}

/* ═══════════════════════════════════════════════════════════
   9 · COMMAND PALETTE
   ═══════════════════════════════════════════════════════════ */

/** Subsequence fuzzy match — "klk" finds "Kalkulator". */
function fuzzy(needle, hay) {
  if (!needle) return 0;
  let i = 0, s = 0, streak = 0;
  for (let j = 0; j < hay.length && i < needle.length; j++) {
    if (hay[j] === needle[i]) {
      streak++; s += 1 + streak * 2 + (j === 0 ? 12 : 0);
      i++;
    } else streak = 0;
  }
  return i === needle.length ? s : -1;
}

function paletteRender() {
  const q = fold(els.paletteInput.value.trim());
  paletteHits = (!q ? docs.slice(0, 40) : docs
    .map((d) => {
      const a = fuzzy(q, d.fTitle);
      const b = fuzzy(q, d.fTags);
      const best = Math.max(a, b === -1 ? -1 : b * 0.6);
      return { d, best };
    })
    .filter((x) => x.best > 0)
    .sort((a, b) => b.best - a.best)
    .slice(0, 40)
    .map((x) => x.d));

  paletteCursor = 0;
  els.paletteList.innerHTML = paletteHits.length
    ? paletteHits.map((d, i) => `<button class="p-item" type="button" role="option" data-i="${i}" aria-selected="${i === 0}">
        <span class="p-name">${esc(d.title)}</span>
        <span class="p-tags">${esc((d.tags || []).slice(0, 2).join(' · '))}</span>
      </button>`).join('')
    : `<p class="palette-empty">${t('noHits')}</p>`;
}

function paletteMove(step) {
  if (!paletteHits.length) return;
  paletteCursor = (paletteCursor + step + paletteHits.length) % paletteHits.length;
  const items = els.paletteList.querySelectorAll('.p-item');
  items.forEach((el, i) => el.setAttribute('aria-selected', String(i === paletteCursor)));
  items[paletteCursor]?.scrollIntoView({ block: 'nearest' });
}

function paletteOpen() {
  lastFocus = document.activeElement;
  els.palette.classList.add('on');
  els.palette.setAttribute('aria-hidden', 'false');
  els.paletteInput.value = '';
  document.body.classList.add('locked');
  paletteRender();
  requestAnimationFrame(() => els.paletteInput.focus());
}

function paletteClose() {
  els.palette.classList.remove('on');
  els.palette.setAttribute('aria-hidden', 'true');
  if (!els.drawer.classList.contains('on')) document.body.classList.remove('locked');
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
}

function paletteChoose(preview) {
  const doc = paletteHits[paletteCursor];
  if (!doc) return;
  paletteClose();
  if (preview) openDrawer(doc.id);
  else window.open(doc.url, '_blank', 'noopener');
}

els.paletteInput.addEventListener('input', paletteRender);
els.paletteList.addEventListener('click', (e) => {
  const btn = e.target.closest('.p-item');
  if (!btn) return;
  paletteCursor = Number(btn.dataset.i);
  paletteChoose(e.shiftKey);
});
els.palette.addEventListener('mousedown', (e) => { if (e.target === els.palette) paletteClose(); });

/* ═══════════════════════════════════════════════════════════
   10 · CLIPBOARD + TOAST
   ═══════════════════════════════════════════════════════════ */

let toastTimer;
function toast(msg) {
  els.toast.textContent = msg;
  els.toast.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => els.toast.classList.remove('on'), 1900);
}

async function copy(text, btn) {
  const url = new URL(text, location.href).href;
  try {
    await navigator.clipboard.writeText(url);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.append(ta);
    ta.select();
    try { document.execCommand('copy'); } catch { /* ignore */ }
    ta.remove();
  }
  toast(t('copied'));
  if (btn) {
    btn.classList.add('ok');
    setTimeout(() => btn.classList.remove('ok'), 1400);
  }
}

/* ═══════════════════════════════════════════════════════════
   11 · KEYBOARD NAVIGATION
   ═══════════════════════════════════════════════════════════ */

function moveCursor(step) {
  if (!visible.length) return;
  cursor = Math.max(0, Math.min(visible.length - 1, cursor + step));
  const cards = els.results.querySelectorAll('.card');
  const card = cards[cursor];
  if (!card) return;
  card.querySelector('.card-link')?.focus({ preventScroll: true });
  card.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

const typing = (el) => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT');

document.addEventListener('keydown', (e) => {
  const mod = e.metaKey || e.ctrlKey;
  const key = e.key.toLowerCase();

  if (mod && key === 'k') { e.preventDefault(); els.palette.classList.contains('on') ? paletteClose() : paletteOpen(); return; }

  if (els.palette.classList.contains('on')) {
    if (e.key === 'Escape') { e.preventDefault(); paletteClose(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); paletteMove(1); }
    if (e.key === 'ArrowUp') { e.preventDefault(); paletteMove(-1); }
    if (e.key === 'Enter') { e.preventDefault(); paletteChoose(e.shiftKey); }
    return;
  }

  if (e.key === 'Escape') {
    if (els.drawer.classList.contains('on')) { e.preventDefault(); closeDrawer(); return; }
    if (document.activeElement === els.search) {
      e.preventDefault();
      els.search.value = '';
      state.q = '';
      els.search.blur();
      render();
      return;
    }
  }

  if (els.drawer.classList.contains('on')) return;

  if (e.key === '/' && !typing(document.activeElement)) { e.preventDefault(); focusSearch(); return; }
  if (typing(document.activeElement) || mod || e.altKey) return;

  if (key === 'j') { e.preventDefault(); moveCursor(1); }
  else if (key === 'k') { e.preventDefault(); moveCursor(cursor < 0 ? 0 : -1); }
  else if (key === 'g') { e.preventDefault(); setView('chart'); }
  else if (key === 'l') { e.preventDefault(); setView('register'); }
  else if (key === 't') { e.preventDefault(); toggleTheme(); }
  else if (e.key === 'Enter' && cursor >= 0 && visible[cursor]) { e.preventDefault(); window.open(visible[cursor].url, '_blank', 'noopener'); }
});

/* ═══════════════════════════════════════════════════════════
   12 · VIEW + THEME
   ═══════════════════════════════════════════════════════════ */

function setView(view) {
  state.view = view;
  localStorage.setItem('workshop.view', view);
  for (const b of document.querySelectorAll('[data-view]')) {
    if (b.tagName === 'BUTTON') b.setAttribute('aria-pressed', String(b.dataset.view === view));
  }
  render();
}

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  localStorage.setItem('workshop.theme', theme);
}

function toggleTheme() {
  setTheme(document.documentElement.dataset.theme === 'night' ? 'day' : 'night');
}

/* ═══════════════════════════════════════════════════════════
   13 · WIRING
   ═══════════════════════════════════════════════════════════ */

let searchTimer;
els.search.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.q = els.search.value; render(); }, 90);
});

els.clear.addEventListener('click', () => {
  els.search.value = ''; state.q = ''; els.search.focus(); render();
});

els.sort.addEventListener('change', () => { state.sort = els.sort.value; render(); });

els.filters.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-tag]');
  if (!btn) return;
  state.tag = btn.dataset.tag || null;
  renderFilters();
  render();
});

els.archiveBtn.addEventListener('click', () => {
  state.archive = !state.archive;
  syncArchive();
  renderFilters();
  render();
});

els.results.addEventListener('click', (e) => {
  const copyBtn = e.target.closest('[data-copy]');
  if (copyBtn) { e.preventDefault(); copy(copyBtn.dataset.copy, copyBtn); return; }

  const versionsBtn = e.target.closest('[data-versions]');
  if (versionsBtn) { e.preventDefault(); openDrawer(versionsBtn.dataset.versions, true); return; }

  // Vlastite poveznice i gumbi rade svoje; klik bilo gdje drugdje po
  // kartici otvara alat, kao i naslov. Označavanje teksta nije klik —
  // bez ove provjere bi svako povlačenje preko opisa otvorilo karticu.
  if (e.target.closest('a, button')) return;
  if (window.getSelection()?.toString()) return;

  const card = e.target.closest('.card');
  const doc = card && docs.find((d) => d.id === card.dataset.id);
  // Alat se otvara u vlastitoj kartici. Panel je ostao samo za starije
  // verzije iz vremenske crte, kojima nema smisla trošiti karticu.
  if (doc) window.open(doc.url, '_blank', 'noopener');
});

els.drawerCopy.addEventListener('click', () => copy(els.drawerCopy.dataset.copy, els.drawerCopy));

for (const b of document.querySelectorAll('.segmented [data-view]')) {
  b.addEventListener('click', () => setView(b.dataset.view));
}
els.themeBtn.addEventListener('click', toggleTheme);

/* ── Jezik ── */

els.langMenu.innerHTML = Object.entries(LANGS).map(([code, name]) =>
  `<button type="button" role="menuitem" data-lang="${code}" aria-pressed="${code === lang}">${name}</button>`).join('');

const closeLangMenu = () => { els.langMenu.hidden = true; els.langBtn.setAttribute('aria-expanded', 'false'); };

els.langBtn.addEventListener('click', (event) => {
  event.stopPropagation();
  els.langMenu.hidden = !els.langMenu.hidden;
  els.langBtn.setAttribute('aria-expanded', String(!els.langMenu.hidden));
});

els.langMenu.addEventListener('click', (event) => {
  const button = event.target.closest('[data-lang]');
  if (!button) return;
  setLang(button.dataset.lang);
  closeLangMenu();
});

document.addEventListener('click', (event) => {
  if (!event.target.closest('.lang-wrap')) closeLangMenu();
});

window.addEventListener('hashchange', () => {
  readUrl();
  renderFilters();
  syncArchive();
  render();
});

/* ═══════════════════════════════════════════════════════════
   14 · BOOT
   ═══════════════════════════════════════════════════════════ */

function hydrate(data) {
  index = data;
  docs = prepare(data.items || []);

  els.stamp.textContent = `${t('rev')} · ${dfLong.format(new Date(data.generatedAt))}`;

  syncArchive();
  renderFilters();
  render();
}

function boot() {
  setTheme(localStorage.getItem('workshop.theme') || 'day');
  applyLang();
  setView(state.view);

  if (!index) {
    els.tally.textContent = t('noIndex');
    els.results.dataset.view = 'chart';
    els.results.innerHTML = `<div class="notice">
      <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h32v22H4Z"/><path d="M4 12 9 5h22l5 7M14 22h12"/></svg>
      <h2>${t('noIndex')}</h2>
      <p>${t('noIndexHint')}</p>
    </div>`;
    return;
  }

  readUrl();
  hydrate(index);

  // dev live-reload
  if (index.dev && location.protocol.startsWith('http')) {
    const es = new EventSource('/__workshop_events');
    es.addEventListener('index-updated', async () => {
      try {
        const res = await fetch(`search-index.json?t=${Date.now()}`);
        hydrate(await res.json());
        toast(t('indexRefreshed'));
      } catch { /* keep the working index */ }
    });
  }
}

boot();
})();
</script>
</body>
